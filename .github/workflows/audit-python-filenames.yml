name: Verify Python filename candidate
on:
  push:
    branches: [shoeshine]
    paths: [.github/workflows/audit-python-filenames.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-enhanced-pdf.txt 'pymupdf==2.0' 'Pillow==11.3.0' 'cryptography==46.0.4'
      - name: Verify dependencies visible under isolated Python
        run: python3 -I -c "import pypdf, pymupdf; print(pypdf.__version__)"
      - name: Prepare candidate
        run: python3 scripts/prepare-python-filenames.py 0 >/dev/null
      - name: Validate candidate syntax and imports
        run: |
          python3 -m compileall -q .
          bash -n install-allow-and-open.sh
          PYTHONPATH=. python3 -c "import importlib; importlib.import_module('module-loader'); import file_launcher; assert file_launcher.__file__.endswith('file-launcher.py')"
      - name: Run impacted security and installation suites
        env:
          PYTHONPATH: .
        run: |
          failures=0
          for test in tests/general/ci-test-scope.py tests/maximum/network-isolation.py tests/maximum/child-process-restriction.py tests/maximum/isolated-renderer.py tests/general/timed-pdf-structure-analysis.py tests/pdf/action-chains.py tests/file/launcher.py tests/general/legacy-scan-scripts.py tests/maximum/isolated-analysis.py tests/maximum/sanitizer-network-denial.py tests/maximum/memory-limits.py tests/general/installation-prerequisites.py tests/general/existing-installation-detection.py; do
            echo "SUITE $test"
            python3 "$test" -v || failures=$((failures+1))
          done
          echo "FAILED_SUITES $failures"
          test "$failures" -eq 0
