name: Diagnose Python filename candidate
on:
  push:
    branches: [shoeshine]
    paths: [.github/workflows/audit-python-filenames.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-enhanced-pdf.txt 'pymupdf==2.0' 'Pillow==11.3.0' 'cryptography==46.0.4'
      - name: Establish baseline
        env:
          PYTHONPATH: .
        run: python3 tests/general/timed-pdf-structure-analysis.py -v
        continue-on-error: true
      - name: Prepare candidate
        run: python3 scripts/prepare-python-filenames.py 0 >/dev/null
      - name: Diagnose synthetic worker and run independent suites
        env:
          PYTHONPATH: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfWriter
          import io, subprocess, sys
          worker = Path("timed-pdf-structure-worker.py")
          source = worker.read_text()
          source = source.replace("except BaseException:\n    # Parent", "except BaseException:\n    import traceback; traceback.print_exc()\n    # Parent")
          worker.write_text(source)
          parser = Path("pdf-structure-parser.py")
          original = parser.read_text()
          parser.write_text(original.replace("except Exception:\n        # pypdf error", "except Exception:\n        import traceback; traceback.print_exc()\n        # pypdf error"))
          stream=io.BytesIO()
          writer=PdfWriter()
          writer.add_blank_page(72,72)
          writer.write(stream)
          result=subprocess.run([sys.executable,"-I","-B",str(worker.resolve())],input=stream.getvalue(),capture_output=True)
          print("WORKER",result.returncode,result.stdout.decode(),result.stderr.decode())
          parser.write_text(original)
          worker.write_text(worker.read_text().replace("    import traceback; traceback.print_exc()\n", ""))
          PY
          failures=0
          for test in tests/general/timed-pdf-structure-analysis.py tests/pdf/action-chains.py tests/file/launcher.py tests/general/legacy-scan-scripts.py tests/maximum/isolated-analysis.py tests/maximum/sanitizer-network-denial.py tests/maximum/memory-limits.py tests/general/installation-prerequisites.py tests/general/existing-installation-detection.py; do
            echo "SUITE $test"
            python3 "$test" -v || failures=$((failures+1))
          done
          echo "FAILED_SUITES $failures"
          test "$failures" -eq 0
