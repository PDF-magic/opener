name: Main integration verification

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.swift"
      - "**.sh"
      - "**.command"
      - "**.json"
      - "**.plist"
      - "**.entitlements"
      - "**.sb"
      - "**.toml"
      - "**.yaml"
      - "**.yml"
      - "requirements*.txt"
      - ".github/workflows/**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each main push must retain its own run, including while another is pending.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  macos-security-integration:
    name: macOS-native integration
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile native progress UI and verify the SwiftUI integration
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors brave-pdf-opener.swift scan-progress-view.swift PDFMagicOpenerApp/ScanProgressPreference.swift -o "$RUNNER_TEMP/PDFOpener"
          python3 scripts/run-test.py tests/scan/progress-component.py -v
      - name: Verify the real macOS deny-by-default filesystem sandbox
        run: python3 scripts/run-test.py tests/maximum/filesystem-sandbox.py -v
      - name: Install pinned dependencies for native CoreGraphics and isolated-renderer tests
        run: python3 -m pip install --disable-pip-version-check "pypdf==5.9.0" "Pillow==11.3.0" "cryptography==46.0.4" "pymupdf==2.0"
      - name: Verify native isolated renderer under deny-by-default confinement
        run: python3 scripts/run-test.py tests/maximum/isolated-renderer.py -v
      - name: Diagnose failed renderer resource setup with no PDF input
        if: ${{ failure() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import maximum_isolated_renderer as renderer

          worker = Path(renderer.__file__).resolve().with_name("maximum_render_worker.py")
          try:
              command = list(renderer._renderer_command(worker, 0))
          except renderer.MaximumPDFRenderError:
              print("renderer_preflight=blocked")
              raise SystemExit(0)
          script = "\n".join((
              "import resource, sys",
              "sys.path.insert(0, " + repr(str(worker.parent)) + ")",
              "try:",
              "    from maximum_isolated_worker import _apply_limits",
              "except BaseException:",
              "    print('probe-import-failed', flush=True)",
              "    raise SystemExit(2)",
              "original = resource.setrlimit",
              "def traced_limit(kind, bounds):",
              "    tags = {resource.RLIMIT_CORE: 'core', resource.RLIMIT_FSIZE: 'fsize', resource.RLIMIT_CPU: 'cpu'}",
              "    print('probe-rlimit-' + tags.get(kind, 'other'), flush=True)",
              "    return original(kind, bounds)",
              "resource.setrlimit = traced_limit",
              "try:",
              "    _apply_limits()",
              "except BaseException:",
              "    print('probe-limits-failed', flush=True)",
              "    raise SystemExit(2)",
              "print('probe-limits-ready', flush=True)",
          ))
          command[-2:] = ["-c", script]
          try:
              result = subprocess.run(
                  command, input=b"", stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL, timeout=10, check=False,
                  close_fds=True, start_new_session=True, cwd="/",
                  env={"PATH": "/usr/bin:/bin", "HOME": "/nonexistent",
                       "LANG": "C", "PYTHONDONTWRITEBYTECODE": "1",
                       "PYTHONNOUSERSITE": "1",
                       "PDF_MAGIC_RENDER_NETWORK_SANDBOX": "seatbelt-v1"},
              )
              print("probe_exit_code=" + str(result.returncode))
              valid = frozenset((b"probe-import-failed", b"probe-rlimit-core",
                  b"probe-rlimit-fsize", b"probe-rlimit-cpu",
                  b"probe-rlimit-other", b"probe-limits-failed",
                  b"probe-limits-ready"))
              for line in result.stdout.splitlines():
                  if line in valid:
                      print("probe_stage=" + line.decode("ascii"))
          except (OSError, subprocess.SubprocessError):
              print("probe_execution=failed")
          PY
      - name: Compile the CoreGraphics PDF sanitizer used by the handoff tests
        run: swiftc -O maximum_sanitized_copy.swift -o maximum-sanitized-copy
      - name: Verify native raster conversion, page fidelity and active-content removal
        run: |
          python3 scripts/run-test.py tests/maximum/sanitized-copy.py -v
          python3 scripts/run-test.py tests/maximum/active-content-removal.py -v
          python3 scripts/run-test.py tests/maximum/sanitizer-reporting.py -v
      - name: Verify sanitizer resource ceilings and process cleanup
        run: |
          python3 scripts/run-test.py tests/maximum/sanitizer-time-limits.py -v
          python3 scripts/run-test.py tests/maximum/sanitizer-memory-limits.py -v
      - name: Verify generated copies are rescanned before browser handoff
        run: python3 scripts/run-test.py tests/maximum/generated-rescan.py -v
      - name: Verify password-protected PDFs never produce sanitized-copy offers
        run: python3 scripts/run-test.py tests/maximum/password-protected.py -v
      - name: Verify the sanitized copy is separate from the original and is safely handed off
        run: python3 scripts/run-test.py tests/maximum/safe-copy-handoff.py -v
      - name: Verify sanitized output structure contains no copied active metadata
        run: python3 scripts/run-test.py tests/maximum/sanitized-structure.py -v
      - name: Reject temporary output symlink, hardlink and directory substitutions
        run: python3 scripts/run-test.py tests/maximum/temporary-output.py -v
