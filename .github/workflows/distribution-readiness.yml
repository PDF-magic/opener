name: Browser extension distribution audit

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  distribution-audit:
    name: Verify unsigned packages and signing prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build unsigned browser distribution packages
        working-directory: extensions/webextension
        run: |
          npm run package:chrome
          npm run package:firefox
      - name: Verify malicious and sensitive fixtures cannot enter release packages
        run: PYTHONPATH=. python3 tests/general/application-helper-packaging.py -v
      - name: Audit channel packages and signing blockers
        run: PYTHONPATH=. python3 tests/general/extension-distribution.py -v
      - name: Check Safari embedded app extension target
        run: PYTHONPATH=. python3 tests/general/safari-extension-target.py -v
      - name: Audit macOS release entitlement and runtime configuration
        run: PYTHONPATH=. python3 tests/general/macos-signing.py -v

  macos-release-signing:
    name: Verify signed Release app and Safari extension
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Audit least-privilege signing configuration
        run: PYTHONPATH=. python3 tests/general/macos-signing.py -v
      - name: Build disposable ad-hoc-signed Release app without credentials
        run: |
          set -euo pipefail
          xcodebuild -project PDFMagicOpener.xcodeproj -scheme PDFMagicOpener -configuration Release -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/PDFMagicSigningDerived" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build
      - name: Verify compiled runtime and exact signed entitlement allowlists
        run: |
          python3 scripts/verify_macos_app_signature.py --app "$RUNNER_TEMP/PDFMagicSigningDerived/Build/Products/Release/PDFMagicOpener.app"
