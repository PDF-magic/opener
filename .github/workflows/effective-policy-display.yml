name: Exact effective protection policy display

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  effective-policy-display:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare expanded policy JSON with enforced scanner resolver
        run: python3 test-effective-policy-display.py -v
