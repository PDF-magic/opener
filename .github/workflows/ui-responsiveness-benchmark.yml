name: Native scan-progress UI responsiveness

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-responsiveness-contract:
    name: UI responsiveness contracts (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify UI measurement contract and scanner safety
        run: PYTHONPATH=. python3 tests/performance/ui-responsiveness.py -v

  native-ui-responsiveness:
    needs: ui-responsiveness-contract
    name: Measure scan-progress event-loop latency (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Benchmark live AppKit panel and Cancel during controlled native scan
        run: python3 ui_responsiveness_benchmark.py --samples 3
