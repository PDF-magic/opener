name: Maximum Isolated PDF Analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  isolated-analysis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PDF parser
        run: python3 -m pip install --disable-pip-version-check 'pypdf==5.9.0'
      - name: Verify real isolated PDF subprocess boundaries
        run: python3 test-maximum-isolated-analysis.py -v
