name: Maximum offline worker CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  offline-worker-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Maximum offline worker fails closed without a macOS sandbox
        run: python3 test-maximum-network-isolation.py -v

  offline-worker-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify macOS Seatbelt blocks real loopback connections and listeners
        run: python3 test-maximum-network-isolation.py -v
