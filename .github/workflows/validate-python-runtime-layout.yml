name: Validate Python runtime relocation
on:
  push:
    branches: [shoeshine]
    paths:
      - .github/workflows/validate-python-runtime-layout.yml
      - scripts/prepare-python-runtime-layout.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare candidate and verify flat runtime import
        run: python3 scripts/prepare-python-runtime-layout.py
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt 'Pillow==11.3.0'
      - name: Validate source and installed-path regressions
        env:
          PYTHONPATH: .
        run: |
          python3 -m compileall -q src tests scripts benchmarks
          bash -n install-allow-and-open.sh allow-and-open.sh
          python3 tests/security/fixed-helper-paths.py -v
          python3 tests/browser/registry.py -v
          python3 tests/file/launcher.py -v
          python3 tests/scan/and-open.py -v
          python3 tests/maximum/isolated-analysis.py -v
          python3 tests/general/timed-pdf-structure-analysis.py -v
          python3 tests/general/quarantine-removal-inventory.py -v
          python3 tests/migration/failed-installation.py -v
          python3 tests/pdf/handler-status.py -v
          python3 tests/signature/update-times.py -v
          python3 tests/maximum/safe-copy-handoff.py -v
