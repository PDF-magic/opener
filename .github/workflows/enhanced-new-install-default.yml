name: Enhanced new-installation recommendation evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enhanced-default-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Guard against unsupported default recommendations and preference changes
        run: python3 test-enhanced-new-install-default.py -v
