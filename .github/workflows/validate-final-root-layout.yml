name: Validate final root layout
on:
  push:
    branches: [shoeshine]
    paths:
      - .github/workflows/validate-final-root-layout.yml
      - scripts/prepare-final-root-layout.py
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/prepare-final-root-layout.py
      - run: python3 -m pip install --disable-pip-version-check -r requirements/requirements-enhanced-pdf.txt 'Pillow==11.3.0'
      - name: Test source and installed paths
        env:
          PYTHONPATH: .
        run: |
          python3 -m compileall -q src tests scripts benchmarks
          for script in scripts/installation/install-allow-and-open.sh src/scan/allow-and-open.sh src/scanner/update-malware-signatures.sh scripts/installation/repair-installation.command; do bash -n "$script"; done
          failed=0
          for test in tests/general/python-source-layout.py tests/general/repair-installation.py tests/general/ci-test-scope.py tests/general/quarantine-removal-inventory.py tests/migration/failed-installation.py tests/pdf/handler-status.py tests/signature/update-times.py tests/maximum/safe-copy-handoff.py tests/security/fixed-helper-paths.py tests/browser/registry.py tests/file/launcher.py tests/scan/and-open.py tests/general/finder-quarantined-application.py tests/maximum/isolated-analysis.py tests/general/timed-pdf-structure-analysis.py; do
            echo "RUN $test"
            python3 "$test" -v || failed=1
          done
          exit "$failed"
