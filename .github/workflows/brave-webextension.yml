name: Brave WebExtension compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "extensions/webextension/**"
      - ".github/workflows/brave-webextension.yml"
  push:
    branches: [main]
    paths:
      - "extensions/webextension/**"
      - ".github/workflows/brave-webextension.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brave-extension-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  brave-extension-smoke:
    name: Brave MV3 extension smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install official Brave stable browser
        run: |
          set -euo pipefail
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg \
            https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources \
            https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq brave-browser
          /usr/bin/brave-browser --version
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and validate unprivileged Chromium extension
        working-directory: extensions/webextension
        run: |
          npm run build
          node --test tests/brave-compatibility.test.mjs tests/brave-pdf-viewer.test.mjs
      - name: Install CI-only Brave automation driver
        working-directory: extensions/webextension
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Launch the actual Brave browser and inspect installed extension
        working-directory: extensions/webextension
        env:
          BRAVE_BROWSER_PATH: /usr/bin/brave-browser
        timeout-minutes: 3
        run: node scripts/smoke-brave.mjs
      - name: Install virtual display for Brave built-in PDF viewer verification
        run: sudo apt-get install -y -qq xvfb
      - name: Verify Brave inline and local-file PDF opening with synthetic documents
        working-directory: extensions/webextension
        env:
          BRAVE_BROWSER_PATH: /usr/bin/brave-browser
        timeout-minutes: 3
        run: xvfb-run -a node scripts/smoke-brave-pdf-viewer.mjs
