name: PDF unsupported-feature inventory

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unsupported-feature-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned optional PDF parser
        run: python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt
      - name: Identify unsupported PDF feature markers
        run: python3 test-pdf-unsupported-feature-inspection.py -v
      - name: Preserve fail-closed unsupported-feature policy
        run: python3 test-unsupported-pdf-features.py -v
      - name: Preserve unusual object-count inspection
        run: python3 test-pdf-unusual-object-counts.py -v
      - name: Preserve strict PDF structure parsing
        run: python3 test-pdf-structure-parser.py -v
