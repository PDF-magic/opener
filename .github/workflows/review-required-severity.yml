name: Review-required Enhanced finding severity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  review-required-severity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify review-required severity in structured findings
        run: python3 test-enhanced-analysis-findings.py -v
      - name: Verify review-required explanations and next actions
        run: python3 test-enhanced-finding-explanations.py -v
      - name: Verify review-required severity cannot become observational
        run: python3 test-enhanced-blocking-policy.py -v
