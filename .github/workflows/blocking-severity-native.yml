name: Blocking severity native progress panel

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  blocking-severity-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native PDF opener with the shared scan progress component
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors brave-pdf-opener.swift scan-progress-view.swift PDFMagicOpenerApp/ScanProgressPreference.swift -o "$RUNNER_TEMP/PDFOpener"
          python3 test-scan-progress-component.py -v
