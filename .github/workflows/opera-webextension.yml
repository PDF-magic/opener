name: Opera WebExtension compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "extensions/webextension/**"
      - ".github/workflows/opera-webextension.yml"
  push:
    branches: [main]
    paths:
      - "extensions/webextension/**"
      - ".github/workflows/opera-webextension.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opera-extension-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  opera-extension-smoke:
    name: Opera Stable MV3 extension smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install official signed Opera Stable package
        run: |
          set -euo pipefail
          curl -fsSL https://deb.opera.com/archive.key -o /tmp/opera-archive.key
          gpg --show-keys --with-colons /tmp/opera-archive.key |
            grep -Fq '6C86BE214648376680CA957B11EE8C00B693A745'
          gpg --dearmor < /tmp/opera-archive.key > /tmp/opera-browser.gpg
          sudo install -m 0644 /tmp/opera-browser.gpg /usr/share/keyrings/opera-browser.gpg
          echo 'deb [signed-by=/usr/share/keyrings/opera-browser.gpg] https://deb.opera.com/opera-stable/ stable non-free' |
            sudo tee /etc/apt/sources.list.d/opera-archive.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq opera-stable xvfb gsettings-desktop-schemas dbus-x11
          test -x /usr/bin/opera
          /usr/bin/opera --version
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and validate the least-privilege Chromium extension
        working-directory: extensions/webextension
        run: |
          npm run build
          node --test tests/opera-compatibility.test.mjs
      - name: Install CI-only Opera automation driver
        working-directory: extensions/webextension
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund puppeteer-core@24.24.1
      - name: Launch real Opera Stable with a disposable profile and inspect the extension
        working-directory: extensions/webextension
        timeout-minutes: 4
        env:
          OPERA_BROWSER_PATH: /usr/bin/opera
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1440x900x24" node scripts/smoke-opera.mjs
