name: Maximum safe-copy handoff

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safe-copy-route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned sanitization dependencies
        run: python3 -m pip install --disable-pip-version-check 'pypdf==5.9.0' 'Pillow==11.3.0'
      - name: Compile the real sanitized conversion worker on macOS
        if: runner.os == 'macOS'
        run: swiftc -O maximum_sanitized_copy.swift -o maximum-sanitized-copy
      - name: Verify random safe-copy filenames and separately scanned handoff
        run: python3 test-maximum-safe-copy-handoff.py -v
