name: Maximum temporary output cleanup

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  temporary-output-cleanup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify owned Maximum temporary output is released safely
        run: python3 test-maximum-temporary-output.py -v
