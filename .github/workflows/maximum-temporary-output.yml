name: Maximum temporary output cleanup

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  temporary-output-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify unpredictable Maximum temporary filenames and safe release
        run: python3 test-maximum-temporary-output.py -v
