name: Enhanced Inconclusive Opening Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inconclusive-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate incomplete Enhanced evidence blocks opening
        run: python3 test-enhanced-inconclusive-results.py -v
      - name: Verify underlying structured report and explanations
        run: |
          python3 test-enhanced-analysis-findings.py -v
          python3 test-enhanced-finding-explanations.py -v
