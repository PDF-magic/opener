name: Maximum Worker Memory Limits

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  maximum-memory-limits:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned passive PDF parser
        run: python3 -m pip install --disable-pip-version-check 'pypdf==5.9.0'
      - name: Verify Maximum worker memory ceilings and fail-closed behavior
        run: python3 test-maximum-memory-limits.py -v
      - name: Verify real isolated PDF analysis respects imposed limits
        run: python3 test-maximum-isolated-analysis.py -v