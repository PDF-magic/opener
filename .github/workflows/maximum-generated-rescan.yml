name: Maximum generated PDF re-scan gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-rescan-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install strict PDF validator
        run: python3 -m pip install --disable-pip-version-check 'pypdf==5.9.0'
      - name: Verify mandatory new scans and fail-closed generated output
        run: python3 test-maximum-generated-rescan.py -v

  generated-rescan-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install strict PDF validator
        run: python3 -m pip install --disable-pip-version-check 'pypdf==5.9.0'
      - name: Build isolated optional CoreGraphics raster converter
        run: swiftc -O maximum_sanitized_copy.swift -o maximum-sanitized-copy
      - name: Verify converted PDF re-enters mandatory scan before browser handoff
        run: python3 test-maximum-generated-rescan.py -v
