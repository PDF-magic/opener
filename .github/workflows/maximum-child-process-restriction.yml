name: Maximum renderer child-process restriction

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  child-process-restriction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify operating-system child-process restrictions
        run: python3 test-maximum-child-process-restriction.py -v
