name: PDF parser advisory watch

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "37 8 * * 2"
  workflow_dispatch:

# Public package metadata only; never read PDFs, credentials or user preferences.
permissions:
  contents: read

jobs:
  parser-advisory-contract:
    name: Validate PDF parser advisory monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify parser inventory, pagination and fail-closed handling
        run: PYTHONPATH=. python3 tests/general/pdf-parser-advisories.py -v

  parser-advisory-live:
    # Advisory network access is scheduled/manual, not required for every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: parser-advisory-contract
    name: Query published PDF parser advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Watch all reviewed parser pins using published OSV advisories
        run: python3 scripts/pdf_parser_advisory_watch.py
