name: Scanner filesystem confinement

on:
  pull_request:
    paths:
      - "scan-and-open.py"
      - "scanner_filesystem_sandbox.py"
      - "tests/scanner/filesystem-sandbox.py"
      - ".github/workflows/scanner-filesystem-confinement.yml"
  push:
    branches: [main]
    paths:
      - "scan-and-open.py"
      - "scanner_filesystem_sandbox.py"
      - "tests/scanner/filesystem-sandbox.py"
      - ".github/workflows/scanner-filesystem-confinement.yml"

permissions:
  contents: read

jobs:
  scanner-filesystem-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deny-by-default policy and fail-closed launch
        run: PYTHONPATH=. python3 tests/scanner/filesystem-sandbox.py -v
      - name: Existing strict scanner options
        run: PYTHONPATH=. python3 tests/scanner/fixed-safety-parameters.py -v
      - name: Existing scan gate regression suite
        run: PYTHONPATH=. python3 tests/scan/and-open.py -v

  scanner-filesystem-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-enforced scanner document read/write isolation
        run: PYTHONPATH=. python3 tests/scanner/filesystem-sandbox.py -v
