name: Unusual PDF object count inspection

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unusual-object-count-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Enhanced PDF parser
        run: python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt
      - name: Flag high, dense, and sparse PDF object counts
        run: python3 test-pdf-unusual-object-counts.py -v
      - name: Preserve object relationship inspection regressions
        run: python3 test-pdf-object-relationships.py -v
      - name: Preserve strict PDF parser regressions
        run: python3 test-pdf-structure-parser.py -v
