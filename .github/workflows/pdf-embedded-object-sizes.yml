name: PDF embedded object size inspection

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  embedded-object-size-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Enhanced PDF parser
        run: python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt
      - name: Detect suspiciously large embedded PDF objects
        run: python3 test-pdf-embedded-object-sizes.py -v
      - name: Preserve attachment scan regressions
        run: python3 test-enhanced-embedded-files.py -v
      - name: Preserve stream-length regression checks
        run: python3 test-pdf-stream-lengths.py -v
