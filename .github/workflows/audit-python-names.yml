name: Validate Python filename migration
on:
  push:
    branches: [shoeshine]
    paths: [.github/workflows/audit-python-names.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-enhanced-pdf.txt
      - name: Verify renamed module and security regression tests
        env:
          PYTHONPATH: .
        run: |
          test -f maximum-network-isolation.py
          test ! -e maximum_network_isolation.py
          python3 -m compileall -q maximum-network-isolation.py maximum_render_worker.py maximum_sanitizer_memory_launcher.py maximum_sanitizer_process.py tests/maximum
          python3 tests/maximum/network-isolation.py -v
          python3 tests/maximum/child-process-restriction.py -v
          python3 tests/maximum/sanitizer-network-denial.py -v
          python3 tests/maximum/isolated-renderer.py -v
          python3 tests/general/ci-test-scope.py -v
