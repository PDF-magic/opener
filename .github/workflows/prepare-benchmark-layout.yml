name: Prepare benchmark layout

on:
  push:
    branches: [shoeshine]
    paths:
      - scripts/prepare-benchmark-layout.py
      - .github/workflows/prepare-benchmark-layout.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt
      - run: python3 scripts/prepare-benchmark-layout.py --test
