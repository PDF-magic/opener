name: PDF document permission inspection

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pdf-permission-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned optional PDF parser
        run: python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt
      - name: Inspect document permissions without decryption
        run: python3 test-pdf-document-permissions.py -v
      - name: Preserve declared metadata inspection tests
        run: python3 test-pdf-declared-metadata.py -v
      - name: Preserve strict structure parser tests
        run: python3 test-pdf-structure-parser.py -v
