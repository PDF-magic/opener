name: PDF structural ambiguity CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pdf-ambiguity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing Enhanced PDF parser dependency
        run: python3 -m pip install --disable-pip-version-check 'pypdf==5.9.0'
      - name: Reject conflicting or ambiguous PDF structures
        run: python3 test-pdf-structure-ambiguity.py -v
