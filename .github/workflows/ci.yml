name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cleanup_queued_runs:
        description: "Cancel obsolete queued Actions runs instead of running the full suite"
        type: boolean
        required: false
        default: false

concurrency:
  # Keep main-push validation independent and non-cancelling.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

jobs:

  chrome-package-smoke:
    # Exercise the actual Chrome Web Store ZIP in a Chrome for Testing browser.
    # Official branded Chrome 137+ disables --load-extension, so use CfT.
    if: (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.cleanup_queued_runs != true)
    name: Chrome package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Load the extracted ZIP as a real Chrome extension
        working-directory: extensions/webextension
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          PACKAGE_DIR: ${{ runner.temp }}/pdfmagic-chrome-smoke
          # Ubuntu hosted runners may not expose unprivileged user namespaces.
          # This flag applies only to the disposable CI test browser/profile.
          CHROME_TEST_NO_SANDBOX: "1"
        run: |
          npm run package:chrome
          mkdir -p "$PACKAGE_DIR"
          unzip -q "dist/chrome/pdf-magic-opener-chrome-$(node -p 'require("./manifest.json").version').zip" -d "$PACKAGE_DIR"
          node scripts/test-chrome.mjs "$CHROME_PATH" "$PACKAGE_DIR"


  detect-scope:
    if: (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.cleanup_queued_runs != true)
    name: Validate dependency map for native CI
    runs-on: ubuntu-latest
    outputs:
      run_macos: ${{ steps.scope.outputs.run_macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select affected suites conservatively
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          # Main pushes validate the complete native suite, independent of paths.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "run_macos=true" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_test_scope.py "$BASE_SHA" "$HEAD_SHA" "$GITHUB_OUTPUT"
          fi
      - name: Verify dependency-map behavior
        run: PYTHONPATH=. python3 tests/general/ci-test-scope.py -v

  scanner-tests:
    if: (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.cleanup_queued_runs != true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check documentation naming and links
        run: python3 scripts/check-docs-layout.py
      - name: Check Python test organization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          tests = list(Path("tests").glob("*/*.py"))
          assert len(tests) >= 250, "Regression suites are missing"
          for path in tests:
              topic = path.parent.name
              assert re.fullmatch(r"[a-z]+(?:-[a-z]+)*", topic), path
              assert re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*\.py", path.name), path
              assert not path.stem.startswith(topic + "-"), path
          assert not list(Path(".").glob("test-*.py"))
          assert not list(Path(".").glob("test_*.py"))
          PY
      - name: Verify safe versioned configuration loading
        run: PYTHONPATH=. python3 tests/configuration/loading.py -v
      - name: Check shell syntax
        run: bash -n install-allow-and-open.sh allow-and-open.sh update-malware-signatures.sh make-pdf-magic-default.command
      - name: Install maintained PDF parser for isolated Enhanced structure tests
        run: python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt
      - name: Classify embedded PDF file types without executing attachments
        run: PYTHONPATH=. python3 tests/pdf/embedded-file-types.py -v
      - name: Verify strict PDF structure parsing with the maintained library
        run: PYTHONPATH=. python3 tests/pdf/structure-parser.py -v
      - name: Enforce the total PDF object budget before graph traversal
        run: PYTHONPATH=. python3 tests/pdf/object-limit.py -v
      - name: Reject PDFs exceeding bounded decoded-stream data
        run: PYTHONPATH=. python3 tests/pdf/decompressed-size.py -v
      - name: Reject excessive PDF recursion depth and cyclic page trees
        run: PYTHONPATH=. python3 tests/pdf/recursion-depth.py -v
      - name: Enforce hard wall-clock timeout on optional PDF structure analysis
        run: PYTHONPATH=. python3 tests/general/timed-pdf-structure-analysis.py -v
      - name: Verify traditional xref tables, xref streams and object streams
        run: PYTHONPATH=. python3 tests/pdf/cross-reference-parsing.py -v
      - name: Verify encrypted and password-protected PDFs remain blocked by policy
        run: PYTHONPATH=. python3 tests/pdf/encryption-policy.py -v
      - name: Reject malformed direct and indirect PDF stream lengths
        run: PYTHONPATH=. python3 tests/pdf/stream-lengths.py -v
      - name: Verify bounded structured PDF parser output contract
        run: PYTHONPATH=. python3 tests/pdf/parser-output.py -v
      - name: Verify structured, fail-closed PDF parsing failure results
        run: PYTHONPATH=. python3 tests/pdf/parser-failure-result.py -v
      - name: Verify the evaluated parser, BSD license and consistent version pin
        run: PYTHONPATH=. python3 tests/pdf/parser-evaluation.py -v
      - name: Measure bounded synthetic PDF parsing RSS with the selected dependency
        run: python3 pdf_parser_memory_benchmark.py --parser pypdf --pages 512 --stream-bytes 4194304
      - name: Inspect indirect PDF object links and page-tree consistency
        run: PYTHONPATH=. python3 tests/pdf/object-relationships.py -v
      - name: Detect suspiciously repeated PDF object structures
        run: PYTHONPATH=. python3 tests/pdf/repeated-structures.py -v
      - name: Inspect automatic PDF action hooks without executing them
        run: PYTHONPATH=. python3 tests/pdf/automatic-actions.py -v
      - name: Detect unusual and contradictory PDF action chains
        run: PYTHONPATH=. python3 tests/pdf/action-chains.py -v
      - name: Inspect JavaScript action payloads without evaluating them
        run: PYTHONPATH=. python3 tests/pdf/javascript-actions.py -v
      - name: Detect hidden active PDF content in incremental revisions
        run: PYTHONPATH=. python3 tests/pdf/revision-active-content.py -v
      - name: Detect XFA form entries without decoding XML
        run: PYTHONPATH=. python3 tests/pdf/xfa-forms.py -v
      - name: Extract declared PDF document metadata without executing contents
        run: PYTHONPATH=. python3 tests/pdf/declared-metadata.py -v
      - name: Inspect PDF document permissions without decryption
        run: PYTHONPATH=. python3 tests/pdf/document-permissions.py -v
      - name: Verify built-in active protection profile label and unchanged scanner gates
        run: PYTHONPATH=. python3 tests/general/active-protection-profile.py -v
      - name: Verify planned protection profile catalog and existing fail-closed policy
        run: PYTHONPATH=. python3 tests/protection/profiles.py -v
      - name: Verify signature update check is within the existing 48-hour window
        run: PYTHONPATH=. python3 tests/signature/freshness-window.py -v
      - name: Detect the last attempted and successful ClamAV signature update times
        run: PYTHONPATH=. python3 tests/signature/update-times.py -v
      - name: Preserve usable ClamAV signatures across failed and overlapping updates
        run: PYTHONPATH=. python3 tests/general/preserve-signature-database.py -v
      - name: Verify staged signatures before activation
        run: PYTHONPATH=. python3 tests/general/validate-signature-database.py -v
      - name: Test signature directory permission failures and rollback
        run: PYTHONPATH=. python3 tests/signature/directory-permissions.py -v
      - name: Verify ClamAV signature update failures are recorded safely
        run: PYTHONPATH=. python3 tests/signature/update-failures.py -v
      - name: Detect incomplete ClamAV signature downloads
        run: PYTHONPATH=. python3 tests/general/incomplete-signature-downloads.py -v
      - name: Handle interrupted signature update network transfers
        run: PYTHONPATH=. python3 tests/signature/network-interruptions.py -v
      - name: Recover the signature update agent after a simulated system restart
        run: PYTHONPATH=. python3 tests/signature/agent-restart.py -v
      - name: Keep scanned document contents out of ClamAV update traffic
        run: PYTHONPATH=. python3 tests/signature/update-privacy.py -v
      - name: Verify live signature-update progress and cleanup
        run: PYTHONPATH=. python3 tests/signature/update-progress.py -v
      - name: Verify scanner-failure response policy and existing fail-closed gate
        run: PYTHONPATH=. python3 tests/scanner/failure-policy.py -v
      - name: Reject unapproved ClamAV arguments before scanner invocation
        run: PYTHONPATH=. python3 tests/scanner/arguments.py -v
      - name: Validate scanner file-size limits without relaxing active flags
        run: PYTHONPATH=. python3 tests/scanner/file-size-limits.py -v
      - name: Verify fixed, non-editable ClamAV parameters
        run: PYTHONPATH=. python3 tests/scanner/parameters-decision.py -v
      - name: Audit safety-fixed ClamAV scanner parameters
        run: PYTHONPATH=. python3 tests/scanner/fixed-safety-parameters.py -v
      - name: Keep scanner failures distinct from rejected feature exceptions
        run: PYTHONPATH=. python3 tests/protection/failure-exception-boundary.py -v
      - name: Detect installed ClamAV binaries without weakening the scan gate
        run: PYTHONPATH=. python3 tests/clamav/installation.py -v
      - name: Reject non-regular ClamAV scanner executables before scanning
        run: PYTHONPATH=. python3 tests/scanner/executable-access.py -v
      - name: Verify fail-closed responses for missing protection dependencies
        run: PYTHONPATH=. python3 tests/general/missing-dependency-policy.py -v
      - name: Verify explicit no-exceptions policy cannot bypass required scanner gates
        run: PYTHONPATH=. python3 tests/protection/exceptions-decision.py -v
      - name: Review the read-only empty protection exceptions list without altering scan safety
        run: PYTHONPATH=. python3 tests/protection/exceptions-review.py -v
      - name: Verify structured policies for every planned protection profile
        run: PYTHONPATH=. python3 tests/general/structured-protection-policy.py -v
      - name: Inspect embedded PDF attachments under the planned Enhanced policy
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt
          PYTHONPATH=. python3 tests/enhanced/embedded-files.py -v
      - name: Inspect embedded PDF filenames without opening attachments
        run: PYTHONPATH=. python3 tests/pdf/embedded-filenames.py -v
      - name: Detect suspiciously large PDF embedded objects
        run: PYTHONPATH=. python3 tests/pdf/embedded-object-sizes.py -v
      - name: Detect excessive PDF decompression requirements safely
        run: PYTHONPATH=. python3 tests/pdf/decompression-requirements.py -v
      - name: Detect unexpected executable signatures in embedded PDF streams
        run: PYTHONPATH=. python3 tests/pdf/embedded-executable-content.py -v
      - name: Inspect external PDF launch actions without executing targets
        run: PYTHONPATH=. python3 tests/pdf/external-launch-actions.py -v
      - name: Detect malformed PDF structures in the planned Enhanced stage
        run: PYTHONPATH=. python3 tests/pdf/malformed-structures.py -v
      - name: Distinguish dangerous PDF behavior from legitimate features
        run: PYTHONPATH=. python3 tests/pdf/behavior-classification.py -v
      - name: Verify maximum processing time for each protection stage
        run: PYTHONPATH=. python3 tests/protection/stage-time-limits.py -v
      - name: Verify required and optional checks for each protection profile
        run: PYTHONPATH=. python3 tests/general/required-optional-profile-checks.py -v
      - name: Verify Maximum inherits every Enhanced protection requirement
        run: PYTHONPATH=. python3 tests/maximum/inherits-enhanced.py -v
      - name: Test every planned profile admission against one reference PDF collection
        run: PYTHONPATH=. python3 tests/general/reference-pdf-profiles.py -v
      - name: Identify PDF format and declared version from file bytes
        run: PYTHONPATH=. python3 tests/pdf/format-identification.py -v
      - name: Resolve the effective protection policy without weakening mandatory checks
        run: PYTHONPATH=. python3 tests/general/effective-protection-policy.py -v
      - name: Identify PDF features unsupported by the current structural analyzer
        run: PYTHONPATH=. python3 tests/pdf/unsupported-feature-inspection.py -v
      - name: Verify fail-closed response to unsupported PDF features
        run: PYTHONPATH=. python3 tests/general/unsupported-pdf-features.py -v
      - name: Verify resource budgets for every protection policy stage
        run: PYTHONPATH=. python3 tests/protection/stage-resource-budgets.py -v
      - name: Verify General reset confirmation and scanner isolation
        run: PYTHONPATH=. python3 tests/general/reset-general-preferences.py -v
      - name: Verify preferences-wide Reset to Defaults confirmation and safe scope
        run: PYTHONPATH=. python3 tests/general/reset-to-defaults.py -v
      - name: Verify main Dock icon and invisible PDF scan-helper policy
        run: PYTHONPATH=. python3 tests/general/dock-behavior.py -v
      - name: Verify selected destination browser display never changes scanner policy
        run: PYTHONPATH=. python3 tests/general/selected-destination-browser.py -v
      - name: Verify native window title and bundled application icon
        run: PYTHONPATH=. python3 tests/native/window-branding.py -v
      - name: Verify independent SwiftUI application target
        run: PYTHONPATH=. python3 tests/general/swiftui-app-target.py -v
      - name: Verify SwiftUI About window, version and AGPL license
        run: PYTHONPATH=. python3 tests/general/about-window.py -v
      - name: Verify SwiftUI main preferences navigation and safe window wiring
        run: PYTHONPATH=. python3 tests/general/main-preferences-window.py -v
      - name: Verify three accessible protection preview cards never change active scan policy
        run: PYTHONPATH=. python3 tests/protection/settings-cards.py -v
      - name: Verify Maximum View Conversion Details action is accessible and preview-only
        run: PYTHONPATH=. python3 tests/maximum/conversion-details-action.py -v
      - name: Verify unavailable mandatory engines block effective profile selection
        run: PYTHONPATH=. python3 tests/general/unavailable-protection-dependencies.py -v
      - name: Verify Reset Protection Settings is confirmed and scoped to preview metadata
        run: PYTHONPATH=. python3 tests/general/reset-protection-settings.py -v
      - name: Verify selected protection previews are saved without scanner activation
        run: PYTHONPATH=. python3 tests/protection/choice-persistence.py -v
      - name: Verify only measured protection timings appear in performance descriptions
        run: PYTHONPATH=. python3 tests/protection/performance-implications.py -v
      - name: Verify opt-in ClamAV startup benchmark is isolated and unmeasured by default
        run: PYTHONPATH=. python3 tests/scanner/startup-benchmark.py -v
      - name: Verify displayed checks for each protection level match the policy schema
        run: PYTHONPATH=. python3 tests/protection/settings-checks.py -v
      - name: Audit increased system text size layout
        run: PYTHONPATH=. python3 tests/preferences/large-text.py -v
      - name: Verify VoiceOver navigation labels
        run: PYTHONPATH=. python3 tests/general/voiceover-preferences-navigation.py -v
      - name: Verify keyboard navigation through preferences
        run: PYTHONPATH=. python3 tests/preferences/keyboard-navigation.py -v
      - name: Verify About and Diagnostics settings page
        run: PYTHONPATH=. python3 tests/general/about-diagnostics-settings-page.py -v
      - name: Verify Advanced Scanning settings page and navigation
        run: PYTHONPATH=. python3 tests/general/advanced-scanning-settings-page.py -v
      - name: Verify dedicated Updates settings page
        run: PYTHONPATH=. python3 tests/updates/settings-page.py -v
      - name: Verify manual update action behavior
        run: PYTHONPATH=. python3 tests/general/manual-update-actions.py -v
      - name: Verify signature update status is read-only and labeled in Updates
        run: PYTHONPATH=. python3 tests/signature/update-status-display.py -v
      - name: Verify stale-signature warning and fail-closed age boundary
        run: PYTHONPATH=. python3 tests/general/stale-signature-warning.py -v
      - name: Verify Notifications settings navigation and safe informational page
        run: PYTHONPATH=. python3 tests/notifications/settings-page.py -v
      - name: Verify dedicated General settings page
        run: PYTHONPATH=. python3 tests/general/settings-page.py -v
      - name: Verify persistent configuration storage location and user customizations
        run: PYTHONPATH=. python3 tests/configuration/location.py -v
      - name: Verify upgrade preserves the installed PDF browser choice
        run: PYTHONPATH=. python3 tests/general/persistent-installer-preferences.py -v
      - name: Verify versioned configuration contract without rewriting preferences
        run: PYTHONPATH=. python3 tests/configuration/schema.py -v
      - name: Verify active scan count reports launched scans only
        run: PYTHONPATH=. python3 tests/general/active-scan-count.py -v
      - name: Verify Show Scan Progress option and scanner safety
        run: PYTHONPATH=. python3 tests/general/show-scan-progress.py -v
      - name: Verify Show Successful Scan Notifications option and fail-closed behavior
        run: |
          PYTHONPATH=. python3 tests/general/show-successful-scan-notifications.py -v
          PYTHONPATH=. python3 tests/general/show-blocked-file-notifications.py -v
      - name: Verify verified default PDF browser selector
        run: PYTHONPATH=. python3 tests/default/pdf-browser-selector.py -v
      - name: Verify default PDF handler indicator is read-only
        run: PYTHONPATH=. python3 tests/general/pdf-handler-indicator.py -v
      - name: Verify explicit General default PDF association action
        run: PYTHONPATH=. python3 tests/general/default-pdf-action.py -v
      - name: Verify opt-in Restore Previous Default action
        run: PYTHONPATH=. python3 tests/general/restore-previous-default.py -v
      - name: Verify Built-in scanner defaults appear before advanced explanations
        run: PYTHONPATH=. python3 tests/scanner/defaults-summary.py -v
      - name: Verify native download connection-health indicator fails closed
        run: PYTHONPATH=. python3 tests/general/download-connection-health.py -v
      - name: Verify browser download monitoring protection and limits explanation
        run: PYTHONPATH=. python3 tests/general/download-monitoring-limits.py -v
      - name: Verify dedicated Browsers settings page and safe navigation
        run: PYTHONPATH=. python3 tests/general/browsers-settings-page.py -v
      - name: Verify opt-in non-PDF download scan preference surface
        run: PYTHONPATH=. python3 tests/download/scan-other-supported-files.py -v
      - name: Verify opt-in browser download failed-scan notifications remain safety-neutral
        run: PYTHONPATH=. python3 tests/download/notify-on-failed-scan.py -v
      - name: Verify download Show Only Warnings option and mandatory warning visibility
        run: PYTHONPATH=. python3 tests/download/show-only-warnings.py -v
      - name: Verify Show Scan Results display preference remains optional and safe
        run: PYTHONPATH=. python3 tests/general/download-scan-results.py -v
      - name: Verify read-only per-browser monitoring status display
        run: PYTHONPATH=. python3 tests/general/browser-monitoring-status.py -v
      - name: Verify read-only Test Browser Integration action
        run: PYTHONPATH=. python3 tests/general/browser-integration-test.py -v
      - name: Verify explanatory help for technical preferences
        run: PYTHONPATH=. python3 tests/general/technical-preferences-help.py -v
      - name: Verify Extensions and Integrations settings page
        run: PYTHONPATH=. python3 tests/general/extensions-integrations-settings-page.py -v
      - name: Verify native messaging length-prefixed stream transport
        run: PYTHONPATH=. python3 tests/native/message-framing.py -v
      - name: Verify Chrome native host manifest, origins and registration safety
        run: PYTHONPATH=. python3 tests/general/chrome-native-host-registration.py -v
      - name: Verify uninstall cleanup removes only matching native host registrations
        run: PYTHONPATH=. python3 tests/native/host-uninstall.py -v
      - name: Verify safe per-browser Chromium native host registration
        run: PYTHONPATH=. python3 tests/native/chromium-registration.py -v
      - name: Set up Node.js for shared WebExtensions project checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and test shared WebExtensions project
        working-directory: extensions/webextension
        run: |
          npm run build
          npm run package:chrome
          npm run package:firefox
          unzip -t dist/firefox-packages/pdf-magic-opener-firefox-*-unsigned.zip
          npm test
      - name: Reject unsupported data URLs before PDF candidate selection
        working-directory: extensions/webextension
        run: node --test tests/pdf-data-url.test.mjs
      - name: Verify passive top-frame PDF navigation detection contract
        working-directory: extensions/webextension
        run: node --test tests/pdf-navigation.test.mjs
      - name: Test PDF links through browser-observed redirects
        working-directory: extensions/webextension
        run: node --test tests/pdf-redirect-links.test.mjs
      - name: Verify passive privileged PDF viewer page recognition
        working-directory: extensions/webextension
        run: node --test tests/pdf-privileged-viewer.test.mjs
      - name: Verify passive PDF navigation response MIME detection
        working-directory: extensions/webextension
        run: node --test tests/pdf-response-mime.test.mjs
      - name: Verify passive attachment disposition response detection
        working-directory: extensions/webextension
        run: node --test tests/pdf-response-attachment.test.mjs
      - name: Verify PDFs served from extensionless URLs using trusted response MIME
        working-directory: extensions/webextension
        run: node --test tests/pdf-extensionless.test.mjs
      - name: Verify passive JavaScript PDF.js viewer candidates
        working-directory: extensions/webextension
        run: node --test tests/pdf-js-viewer.test.mjs
      - name: Verify passive inline Content-Disposition response detection
        working-directory: extensions/webextension
        run: node --test tests/pdf-inline-disposition.test.mjs
      - name: Verify versioned native JSON message contract
        run: PYTHONPATH=. python3 tests/native/message-format.py -v
      - name: Upload validated Chrome extension package
        uses: actions/upload-artifact@v4
        with:
          name: pdf-magic-opener-chrome
          path: extensions/webextension/dist/chrome/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload validated unsigned Firefox extension package
        uses: actions/upload-artifact@v4
        with:
          name: pdf-magic-opener-firefox-unsigned
          path: extensions/webextension/dist/firefox-packages/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Reject unsafe Safari packages in portable tests
        run: PYTHONPATH=. python3 tests/general/safari-extension-package.py -v
      - name: Verify sandboxed Safari Web Extension target configuration
        run: |
          PYTHONPATH=. python3 tests/general/safari-extension-target.py -v
          PYTHONPATH=. python3 tests/general/safari-extension-permissions.py -v
          PYTHONPATH=. python3 tests/general/safari-extension-activation.py -v
          PYTHONPATH=. python3 tests/browser/preferences-deep-link.py -v
      - name: Verify native Settings shortcut
        run: PYTHONPATH=. python3 tests/settings/keyboard-shortcut.py -v
      - name: Verify menu-bar status item decision
        run: PYTHONPATH=. python3 tests/general/menu-bar-decision.py -v
      - name: Verify Launch at Login is unnecessary for the standalone preferences app
        run: PYTHONPATH=. python3 tests/launch/at-login-decision.py -v
      - name: Verify native application Quit action
        run: PYTHONPATH=. python3 tests/native/quit-action.py -v
      - name: Verify opt-in PDF default-handler action
        run: PYTHONPATH=. python3 tests/pdf/default-user-action.py -v
      - name: Verify application naming and migration
        run: PYTHONPATH=. python3 tests/app/name.py
      - name: Verify generic PDF default-handler utility naming
        run: PYTHONPATH=. python3 tests/pdf/default-handler-name.py -v
      - name: Verify opt-in PDF handler restoration offer
        run: PYTHONPATH=. python3 tests/general/offer-restore-pdf-handler.py -v
      - name: Verify macOS PDF default-handler status reporting
        run: PYTHONPATH=. python3 tests/pdf/handler-status.py -v
      - name: Verify active scan policy cannot change during execution
        run: PYTHONPATH=. python3 tests/scan/policy-snapshot.py -v
      - name: Verify installed scanner configuration boundary values
        run: PYTHONPATH=. python3 tests/scanner/configuration-boundaries.py -v
      - name: Verify macOS quarantine remains after clean, cached, and blocked scans
        run: PYTHONPATH=. python3 tests/general/retain-os-quarantine.py -v
      - name: Verify Standard baseline parity with the existing scanner
        run: PYTHONPATH=. python3 tests/general/standard-scanner-parity.py -v
      - name: Reject zero-length files before scanning, caching, or opening
