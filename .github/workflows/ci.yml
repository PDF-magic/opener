name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check shell syntax
        run: bash -n install-allow-and-open.sh allow-and-open.sh update-malware-signatures.sh
      - name: Verify application naming and migration
        run: python3 test-app-name.py
      - name: Run scan-gate tests
        run: python3 test-scan-and-open.py
      - name: Verify scan-request origin records
        run: python3 test-scan-request-origin.py

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native PDF opener
        run: xcrun swiftc brave-pdf-opener.swift -o "$RUNNER_TEMP/PDFOpener"
      - name: Compile PDF handler utility
        run: xcrun swiftc set-brave-pdf-default.swift -o "$RUNNER_TEMP/SetPDFHandler"
      - name: Verify native open-event origin classification
        run: python3 test-native-request-origin.py
