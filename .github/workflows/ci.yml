  cancel-stale-runs:
    # Queue cleanup is an explicit maintenance action, not a side effect of
    # merging. Never indiscriminately cancel queued validation on main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.cleanup_queued_runs == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Cancel queued runs superseded by the consolidated CI workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ci_workflow_id="$(gh api "repos/$REPO/actions/workflows/ci.yml" --jq '.id')"
          open_pr_shas="$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.sha')"
          cancelled=0
          declare -A preserved_ids=()
          while true; do
            queued_runs="$(gh api --paginate "repos/$REPO/actions/runs?status=queued&per_page=100" --jq '.workflow_runs[] | [.id, .workflow_id, .head_branch, .head_sha, .event] | @tsv')"
            [[ -z "$queued_runs" ]] && break
            batch_cancelled=0
            while IFS=$'\t' read -r run_id workflow_id branch_name sha event; do
              [[ -z "$run_id" ]] && continue
              # Never cancel main validation or the current workflow run.
              if [[ "$branch_name" == "main" || "$sha" == "$CURRENT_SHA" ]]; then
                continue
              fi
              if [[ "$event" == "pull_request" ]] && grep -Fxq "$sha" <<< "$open_pr_shas"; then
                preserved_ids["$run_id"]=1
                continue
              fi
              if gh api --method POST "repos/$REPO/actions/runs/$run_id/cancel" >/dev/null; then
                cancelled=$((cancelled + 1))
                batch_cancelled=$((batch_cancelled + 1))
                if (( cancelled % 25 == 0 )); then
                  echo "Cancelled $cancelled obsolete queued runs so far."
                fi
              else
                echo "Could not cancel queued run $run_id; it may have started or already been cancelled." >&2
              fi
            done <<< "$queued_runs"
            if (( batch_cancelled == 0 )); then
              break
            fi
          done
          echo "Cancelled $cancelled obsolete queued runs; preserved ${#preserved_ids[@]} queued runs for current open PR heads."
