name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check shell syntax
        run: bash -n install-allow-and-open.sh allow-and-open.sh update-malware-signatures.sh make-pdf-magic-default.command
      - name: Verify opt-in PDF default-handler action
        run: python3 test-pdf-default-user-action.py -v
      - name: Verify application naming and migration
        run: python3 test-app-name.py
      - name: Verify generic PDF default-handler utility naming
        run: python3 test-pdf-default-handler-name.py -v
      - name: Verify opt-in PDF handler restoration offer
        run: python3 test-offer-restore-pdf-handler.py -v
      - name: Verify macOS PDF default-handler status reporting
        run: python3 test-pdf-handler-status.py -v
      - name: Run scan-gate and request-metadata tests
        run: python3 test-scan-and-open.py -v
      - name: Verify cancellation and scanner process-group cleanup
        timeout-minutes: 2
        run: python3 test-cancellation.py -v
      - name: Verify detection and opening decisions are separate
        run: python3 test-detection-policy.py -v
      - name: Verify optional browser download identifiers
        run: python3 test-browser-download-id.py -v
      - name: Verify supported browser bundle identifier registry
        run: python3 test-browser-registry.py -v
      - name: Verify browser-independent scan engine and launch defaults
        run: python3 test-file-launcher.py
      - name: Verify PDF scan gates on external-drive paths
        run: python3 test-external-drives.py -v
      - name: Verify download-availability launch gate
        run: python3 test-download-availability.py -v
      - name: Verify locally accessible iCloud Drive PDFs
        run: python3 test-icloud-drive.py -v
      - name: Verify original PDF filenames, Unicode and special-character paths
        run: python3 test-pdf-filename-paths.py -v
      - name: Verify configurable PDF targets including Arc and Opera
        run: python3 test-target-app.py
      - name: Verify Microsoft Edge PDF launch routing and fail-closed behavior
        run: python3 test-edge-target.py -v
      - name: Verify Chromium PDF launching and fail-closed preflight
        run: python3 test-chromium-launch.py -v
      - name: Verify system-default-browser selection and fail-closed handoff
        run: python3 test-system-default-browser.py -v
      - name: Verify selector hides unsupported browsers and marks macOS default
        run: python3 test-browser-preference-selector.py -v
      - name: Verify explicit custom application choice and atomic persistence
        run: python3 test-select-custom-pdf-application.py -v
      - name: Verify Brave PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: brave
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Google Chrome PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: chrome
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Mozilla Firefox PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: firefox
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Safari PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: safari
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Microsoft Edge PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: edge
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Chromium PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: chromium
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Vivaldi PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: vivaldi
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Opera PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: opera
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Arc PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: arc
        run: python3 test-browser-pdf-behavior.py
      - name: Verify stable and preview browser release classification
        run: python3 test-browser-release.py -v
      - name: Verify browser PDF viewer comparison documentation
        run: python3 test-browser-viewer-docs.py -v
      - name: Verify optional PDF fallback selection and safety
        run: python3 test-fallback-app.py -v
      - name: Verify clean scan results survive launch failures
        run: python3 test-launch-results.py -v
      - name: Verify scan-request origin records
        run: python3 test-scan-request-origin.py
      - name: Verify scan-request application attribution
        run: python3 test-scan-request.py
      - name: Verify file lifecycle state transitions
        run: python3 test-file-lifecycle.py
      - name: Verify cross-process scan concurrency
        run: python3 test-scan-concurrency.py
      - name: Verify native owner termination aborts active scans
        run: python3 test-app-termination.py -v

      - name: Verify scan result contract
        run: python3 test-scan-results.py

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify on-open, live and manual browser refresh actions
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors -D BROWSER_DISCOVERY_TESTING -D BROWSER_METADATA_TESTING browser-preference-list.swift browser-preference-live-refresh.swift discover-installed-browsers.swift browser-app-metadata.swift -o "$RUNNER_TEMP/BrowserPreferenceList"
          xcrun swiftc -parse-as-library -warnings-as-errors -D BROWSER_DISCOVERY_TESTING -D BROWSER_METADATA_TESTING -D BROWSER_PREFERENCE_TESTING browser-preference-list.swift discover-installed-browsers.swift browser-app-metadata.swift test-browser-preference-list.swift -o "$RUNNER_TEMP/TestBrowserPreferenceList"
          "$RUNNER_TEMP/TestBrowserPreferenceList"
          xcrun swiftc -parse-as-library -warnings-as-errors -D BROWSER_DISCOVERY_TESTING -D BROWSER_METADATA_TESTING -D BROWSER_PREFERENCE_TESTING browser-preference-list.swift browser-preference-live-refresh.swift discover-installed-browsers.swift browser-app-metadata.swift test-browser-preference-live-refresh.swift -o "$RUNNER_TEMP/TestBrowserPreferenceLiveRefresh"
          "$RUNNER_TEMP/TestBrowserPreferenceLiveRefresh"
          if "$RUNNER_TEMP/BrowserPreferenceList" --metadata-stdin </dev/null; then exit 1; fi
          if "$RUNNER_TEMP/BrowserPreferenceList" --invalid-option; then exit 1; fi
      - name: Compile native PDF opener
        run: xcrun swiftc brave-pdf-opener.swift -o "$RUNNER_TEMP/PDFOpener"
      - name: Verify user-triggered PDF Magic default selection without altering CI defaults
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors make-pdf-magic-default.swift -o "$RUNNER_TEMP/MakePDFMagicDefault"
          xcrun swiftc -parse-as-library -warnings-as-errors -D PDF_DEFAULT_ACTION_TESTING make-pdf-magic-default.swift test-make-pdf-magic-default.swift -o "$RUNNER_TEMP/TestMakePDFMagicDefault"
          "$RUNNER_TEMP/TestMakePDFMagicDefault"
          if "$RUNNER_TEMP/MakePDFMagicDefault" unexpected-argument; then exit 1; fi
      - name: Compile PDF handler utility
        run: xcrun swiftc set-pdf-default-handler.swift -o "$RUNNER_TEMP/SetPDFHandler"
      - name: Verify that PDF default-handler updates take effect
        run: python3 test-pdf-default-handler.py -v
      - name: Verify previous PDF-handler backup and safe restoration
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors pdf-handler-history.swift -o "$RUNNER_TEMP/PDFHandlerHistory"
          xcrun swiftc -parse-as-library -warnings-as-errors -D PDF_HANDLER_HISTORY_TESTING pdf-handler-history.swift test-pdf-handler-history.swift -o "$RUNNER_TEMP/TestPDFHandlerHistory"
          "$RUNNER_TEMP/TestPDFHandlerHistory"
          if "$RUNNER_TEMP/PDFHandlerHistory" >/dev/null 2>&1; then exit 1; fi
      - name: Identify the current macOS PDF handler without modifying it
        run: |
          xcrun swiftc -parse-as-library identify-pdf-handler.swift -o "$RUNNER_TEMP/IdentifyPDFHandler"
          xcrun swiftc -parse-as-library -D PDF_HANDLER_TESTING identify-pdf-handler.swift test-pdf-handler.swift -o "$RUNNER_TEMP/TestPDFHandler"
          "$RUNNER_TEMP/TestPDFHandler"
          if "$RUNNER_TEMP/IdentifyPDFHandler" unexpected-argument >/dev/null 2>&1; then exit 1; fi
      - name: Detect when another application becomes the PDF default
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors -D PDF_HANDLER_TESTING identify-pdf-handler.swift detect-pdf-handler-change.swift -o "$RUNNER_TEMP/DetectPDFHandlerChange"
          xcrun swiftc -parse-as-library -warnings-as-errors -D PDF_HANDLER_TESTING -D PDF_HANDLER_CHANGE_TESTING identify-pdf-handler.swift detect-pdf-handler-change.swift test-detect-pdf-handler.swift -o "$RUNNER_TEMP/TestDetectPDFHandler"
          "$RUNNER_TEMP/TestDetectPDFHandler"
          if "$RUNNER_TEMP/DetectPDFHandlerChange" unexpected-argument >/dev/null 2>&1; then exit 1; fi
      - name: Verify discovered app availability, PDF handlers and signed browser exceptions
        run: |
          xcrun swiftc -parse-as-library verify-pdf-target.swift -o "$RUNNER_TEMP/VerifyPDFTarget"
          xcrun swiftc -parse-as-library -D PDF_TARGET_TESTING verify-pdf-target.swift test-verify-pdf-target.swift -o "$RUNNER_TEMP/TestPDFTarget"
          "$RUNNER_TEMP/TestPDFTarget"
          if "$RUNNER_TEMP/VerifyPDFTarget" >/dev/null 2>&1; then exit 1; fi
          if [ -d /Applications/Safari.app ]; then
            "$RUNNER_TEMP/VerifyPDFTarget" com.apple.Safari
          fi
          if [ -d /Applications/Firefox.app ]; then
            "$RUNNER_TEMP/VerifyPDFTarget" org.mozilla.firefox
          fi
      - name: Compile and smoke-test NSWorkspace launcher
        run: |
          xcrun swiftc -warnings-as-errors launch-scanned-file.swift -o "$RUNNER_TEMP/LaunchScannedFile"
          if "$RUNNER_TEMP/LaunchScannedFile"; then exit 1; fi
          if "$RUNNER_TEMP/LaunchScannedFile" "$RUNNER_TEMP/nonexistent.pdf"; then exit 1; fi
          if "$RUNNER_TEMP/LaunchScannedFile" --bundle-id com.brave.Browser "$RUNNER_TEMP/nonexistent.pdf"; then exit 1; fi
          if "$RUNNER_TEMP/LaunchScannedFile" --bundle-id org.chromium.Chromium "$RUNNER_TEMP/nonexistent.pdf"; then exit 1; fi
          if "$RUNNER_TEMP/LaunchScannedFile" --bundle-id com.apple.Safari "$RUNNER_TEMP/nonexistent.pdf"; then exit 1; fi
          if "$RUNNER_TEMP/LaunchScannedFile" --bundle-id company.thebrowser.Browser "$RUNNER_TEMP/nonexistent.pdf"; then exit 1; fi
          if "$RUNNER_TEMP/LaunchScannedFile" --bundle-id com.operasoftware.Opera "$RUNNER_TEMP/nonexistent.pdf"; then exit 1; fi
          if "$RUNNER_TEMP/LaunchScannedFile" --bundle-id org.mozilla.firefox "$RUNNER_TEMP/nonexistent.pdf"; then exit 1; fi
          printf '%%PDF-1.4\n' > "$RUNNER_TEMP/downloaded.pdf"
          "$RUNNER_TEMP/LaunchScannedFile" --check-local "$RUNNER_TEMP/downloaded.pdf"
          if "$RUNNER_TEMP/LaunchScannedFile" --check-local "$RUNNER_TEMP/nonexistent.pdf"; then exit 1; fi
      - name: Verify native PDF cloud download-state decisions
        run: python3 test-native-file-availability.py
      - name: Verify browser names, icons, versions and executable paths
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors browser-app-metadata.swift -o "$RUNNER_TEMP/ReadBrowserApplicationMetadata"
          xcrun swiftc -parse-as-library -warnings-as-errors -D BROWSER_METADATA_TESTING browser-app-metadata.swift test-browser-app-metadata.swift -o "$RUNNER_TEMP/TestBrowserApplicationMetadata"
          BROWSER_METADATA_TOOL="$RUNNER_TEMP/ReadBrowserApplicationMetadata" "$RUNNER_TEMP/TestBrowserApplicationMetadata"
          if "$RUNNER_TEMP/ReadBrowserApplicationMetadata"; then exit 1; fi
      - name: Compile and test system-default-browser resolution
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors resolve-default-browser.swift -o "$RUNNER_TEMP/ResolveDefaultBrowser"
          xcrun swiftc -parse-as-library -warnings-as-errors -D DEFAULT_BROWSER_TESTING resolve-default-browser.swift test-default-browser.swift -o "$RUNNER_TEMP/TestDefaultBrowser"
          "$RUNNER_TEMP/TestDefaultBrowser"
          if "$RUNNER_TEMP/ResolveDefaultBrowser" unexpected-argument; then exit 1; fi
      - name: Discover installed macOS browsers across standard and custom locations
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors discover-installed-browsers.swift -o "$RUNNER_TEMP/DiscoverInstalledBrowsers"
          xcrun swiftc -parse-as-library -warnings-as-errors -D BROWSER_DISCOVERY_TESTING discover-installed-browsers.swift test-installed-browsers.swift -o "$RUNNER_TEMP/TestInstalledBrowsers"
          "$RUNNER_TEMP/TestInstalledBrowsers"
          "$RUNNER_TEMP/DiscoverInstalledBrowsers" | python3 -c 'import json, sys; assert isinstance(json.load(sys.stdin), list)'
          if "$RUNNER_TEMP/DiscoverInstalledBrowsers" --application relative.app; then exit 1; fi
          if "$RUNNER_TEMP/DiscoverInstalledBrowsers" --search-directory; then exit 1; fi
      - name: Test browser discovery with Brave only
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors -D BROWSER_DISCOVERY_TESTING discover-installed-browsers.swift test-brave-only-discovery.swift -o "$RUNNER_TEMP/TestBraveOnlyDiscovery"
          "$RUNNER_TEMP/TestBraveOnlyDiscovery"
      - name: Verify Safari-only installed browser discovery
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors -D BROWSER_DISCOVERY_TESTING discover-installed-browsers.swift test-safari-only-discovery.swift -o "$RUNNER_TEMP/TestSafariOnlyDiscovery"
          "$RUNNER_TEMP/TestSafariOnlyDiscovery"
      - name: Test Firefox and Chromium installed together
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors -D BROWSER_DISCOVERY_TESTING discover-installed-browsers.swift test-firefox-chromium-discovery.swift -o "$RUNNER_TEMP/TestFirefoxChromiumDiscovery"
          "$RUNNER_TEMP/TestFirefoxChromiumDiscovery"
      - name: Verify renamed browser bundles are rediscovered safely
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors -D BROWSER_DISCOVERY_TESTING discover-installed-browsers.swift test-renamed-browser-discovery.swift -o "$RUNNER_TEMP/TestRenamedBrowserDiscovery"
          "$RUNNER_TEMP/TestRenamedBrowserDiscovery"
      - name: Query and validate installed macOS applications
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors installed-applications.swift -o "$RUNNER_TEMP/InstalledApplications"
          xcrun swiftc -parse-as-library -warnings-as-errors -D INSTALLED_APPS_TESTING installed-applications.swift test-installed-applications.swift -o "$RUNNER_TEMP/TestInstalledApplications"
          "$RUNNER_TEMP/TestInstalledApplications"
          if "$RUNNER_TEMP/InstalledApplications" >/dev/null 2>&1; then exit 1; fi
          if "$RUNNER_TEMP/InstalledApplications" " " >/dev/null 2>&1; then exit 1; fi
          "$RUNNER_TEMP/InstalledApplications" "__pdf_magic_uninstalled_app_0123__" > "$RUNNER_TEMP/installed-apps.json"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1], encoding="utf-8")) == []' "$RUNNER_TEMP/installed-apps.json"
      - name: Validate manually chosen application bundles against PDF launch targets
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors -D PDF_TARGET_TESTING \
            verify-pdf-target.swift select-custom-pdf-application.swift \
            -o "$RUNNER_TEMP/SelectCustomPDFApplication"
          xcrun swiftc -parse-as-library -warnings-as-errors -D PDF_TARGET_TESTING \
            -D CUSTOM_APP_SELECTION_TESTING verify-pdf-target.swift \
            select-custom-pdf-application.swift test-select-custom-pdf-application.swift \
            -o "$RUNNER_TEMP/TestSelectCustomPDFApplication"
          "$RUNNER_TEMP/TestSelectCustomPDFApplication"
          if "$RUNNER_TEMP/SelectCustomPDFApplication" --application relative.app; then exit 1; fi
          if "$RUNNER_TEMP/SelectCustomPDFApplication" --application "$RUNNER_TEMP/Absent.app"; then exit 1; fi
      - name: Verify PDF handoff to an already-running browser process
        timeout-minutes: 3
        run: python3 test-browser-already-running.py -v
      - name: Verify bundle-identifier resolution, duplicate installations and app existence
        run: python3 test-bundle-target.py
      - name: Verify Finder-style PDF open-event delivery through Launch Services
        timeout-minutes: 3
        run: python3 test-finder-double-click.py
      - name: Verify PDF drop onto an explicitly selected macOS app
        timeout-minutes: 3
        run: python3 test-pdf-drag-drop.py
      - name: Verify duplicate-open handling and queued native scans
        timeout-minutes: 5
        run: python3 test-brave-pdf-opener.py
      - name: Verify native Cancel stops active and queued requests
        timeout-minutes: 2
        run: python3 test-native-cancellation.py
      - name: Verify scan subprocess resources are cleaned on failure
        timeout-minutes: 5
        run: python3 test-scan-resource-cleanup.py
      - name: Compile Finder Open AppleScript and test the safe integration harness
        timeout-minutes: 2
        run: |
          /usr/bin/osacompile -o "$RUNNER_TEMP/FinderOpen.scpt" test-finder-open.applescript
          python3 test-finder-open.py -v
      - name: Verify native open-event origin classification
        run: python3 test-native-request-origin.py
      - name: Verify per-request timestamps and duplicate suppression
        timeout-minutes: 5
        run: python3 test-request-timestamp.py
