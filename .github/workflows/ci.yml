name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify safe versioned configuration loading
        run: python3 -m unittest discover -p 'test-configuration-loading.py' -v
      - name: Check shell syntax
        run: bash -n install-allow-and-open.sh allow-and-open.sh update-malware-signatures.sh make-pdf-magic-default.command
      - name: Install maintained PDF parser for isolated Enhanced structure tests
        run: python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt
      - name: Classify embedded PDF file types without executing attachments
        run: python3 test-pdf-embedded-file-types.py -v
      - name: Verify strict PDF structure parsing with the maintained library
        run: python3 test-pdf-structure-parser.py -v
      - name: Enforce the total PDF object budget before graph traversal
        run: python3 test-pdf-object-limit.py -v
      - name: Enforce hard wall-clock timeout on optional PDF structure analysis
        run: python3 test-timed-pdf-structure-analysis.py -v
      - name: Verify traditional xref tables, xref streams and object streams
        run: python3 test-pdf-cross-reference-parsing.py -v
      - name: Reject malformed direct and indirect PDF stream lengths
        run: python3 test-pdf-stream-lengths.py -v
      - name: Verify bounded structured PDF parser output contract
        run: python3 test-pdf-parser-output.py -v
      - name: Verify structured, fail-closed PDF parsing failure results
        run: python3 test-pdf-parser-failure-result.py -v
      - name: Verify the evaluated parser, BSD license and consistent version pin
        run: python3 test-pdf-parser-evaluation.py -v
      - name: Measure bounded synthetic PDF parsing RSS with the selected dependency
        run: python3 pdf_parser_memory_benchmark.py --parser pypdf --pages 512 --stream-bytes 4194304
      - name: Inspect indirect PDF object links and page-tree consistency
        run: python3 test-pdf-object-relationships.py -v
      - name: Detect suspiciously repeated PDF object structures
        run: python3 test-pdf-repeated-structures.py -v
      - name: Inspect automatic PDF action hooks without executing them
        run: python3 test-pdf-automatic-actions.py -v
      - name: Detect unusual and contradictory PDF action chains
        run: python3 test-pdf-action-chains.py -v
      - name: Inspect JavaScript action payloads without evaluating them
        run: python3 test-pdf-javascript-actions.py -v
      - name: Detect hidden active PDF content in incremental revisions
        run: python3 test-pdf-revision-active-content.py -v
      - name: Detect XFA form entries without decoding XML
        run: python3 test-pdf-xfa-forms.py -v
      - name: Extract declared PDF document metadata without executing contents
        run: python3 test-pdf-declared-metadata.py -v
      - name: Inspect PDF document permissions without decryption
        run: python3 test-pdf-document-permissions.py -v
      - name: Verify built-in active protection profile label and unchanged scanner gates
        run: python3 test-active-protection-profile.py -v
      - name: Verify planned protection profile catalog and existing fail-closed policy
        run: python3 test-protection-profiles.py -v
      - name: Verify signature update check is within the existing 48-hour window
        run: python3 test-signature-freshness-window.py -v
      - name: Detect the last attempted and successful ClamAV signature update times
        run: python3 test-signature-update-times.py -v
      - name: Preserve usable ClamAV signatures across failed and overlapping updates
        run: python3 test-preserve-signature-database.py -v
      - name: Verify staged signatures before activation
        run: python3 test-validate-signature-database.py -v
      - name: Test signature directory permission failures and rollback
        run: python3 test-signature-directory-permissions.py -v
      - name: Verify ClamAV signature update failures are recorded safely
        run: python3 test-signature-update-failures.py -v
      - name: Detect incomplete ClamAV signature downloads
        run: python3 test-incomplete-signature-downloads.py -v
      - name: Handle interrupted signature update network transfers
        run: python3 test-signature-network-interruptions.py -v
      - name: Recover the signature update agent after a simulated system restart
        run: python3 test-signature-agent-restart.py -v
      - name: Keep scanned document contents out of ClamAV update traffic
        run: python3 test-signature-update-privacy.py -v
      - name: Verify live signature-update progress and cleanup
        run: python3 test-signature-update-progress.py -v
      - name: Verify scanner-failure response policy and existing fail-closed gate
        run: python3 test-scanner-failure-policy.py -v
      - name: Reject unapproved ClamAV arguments before scanner invocation
        run: python3 test-scanner-arguments.py -v
      - name: Validate scanner file-size limits without relaxing active flags
        run: python3 test-scanner-file-size-limits.py -v
      - name: Verify fixed, non-editable ClamAV parameters
        run: python3 test-scanner-parameters-decision.py -v
      - name: Audit safety-fixed ClamAV scanner parameters
        run: python3 test-scanner-fixed-safety-parameters.py -v
      - name: Keep scanner failures distinct from rejected feature exceptions
        run: python3 test-protection-failure-exception-boundary.py -v
      - name: Detect installed ClamAV binaries without weakening the scan gate
        run: python3 test-clamav-installation.py -v
      - name: Verify fail-closed responses for missing protection dependencies
        run: python3 test-missing-dependency-policy.py -v
      - name: Verify explicit no-exceptions policy cannot bypass required scanner gates
        run: python3 test-protection-exceptions-decision.py -v
      - name: Review the read-only empty protection exceptions list without altering scan safety
        run: python3 test-protection-exceptions-review.py -v
      - name: Verify structured policies for every planned protection profile
        run: python3 test-structured-protection-policy.py -v
      - name: Inspect embedded PDF attachments under the planned Enhanced policy
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt
          python3 test-enhanced-embedded-files.py -v
      - name: Inspect embedded PDF filenames without opening attachments
        run: python3 test-pdf-embedded-filenames.py -v
      - name: Detect suspiciously large PDF embedded objects
        run: python3 test-pdf-embedded-object-sizes.py -v
      - name: Detect excessive PDF decompression requirements safely
        run: python3 test-pdf-decompression-requirements.py -v
      - name: Detect unexpected executable signatures in embedded PDF streams
        run: python3 test-pdf-embedded-executable-content.py -v
      - name: Inspect external PDF launch actions without executing targets
        run: python3 test-pdf-external-launch-actions.py -v
      - name: Detect malformed PDF structures in the planned Enhanced stage
        run: python3 test-pdf-malformed-structures.py -v
      - name: Distinguish dangerous PDF behavior from legitimate features
        run: python3 test-pdf-behavior-classification.py -v
      - name: Verify maximum processing time for each protection stage
        run: python3 test-protection-stage-time-limits.py -v
      - name: Verify required and optional checks for each protection profile
        run: python3 test-required-optional-profile-checks.py -v
      - name: Verify Maximum inherits every Enhanced protection requirement
        run: python3 test-maximum-inherits-enhanced.py -v
      - name: Test every planned profile admission against one reference PDF collection
        run: python3 test-reference-pdf-profiles.py -v
      - name: Identify PDF format and declared version from file bytes
        run: python3 test-pdf-format-identification.py -v
      - name: Resolve the effective protection policy without weakening mandatory checks
        run: python3 test-effective-protection-policy.py -v
      - name: Identify PDF features unsupported by the current structural analyzer
        run: python3 test-pdf-unsupported-feature-inspection.py -v
      - name: Verify fail-closed response to unsupported PDF features
        run: python3 test-unsupported-pdf-features.py -v
      - name: Verify resource budgets for every protection policy stage
        run: python3 test-protection-stage-resource-budgets.py -v
      - name: Verify General reset confirmation and scanner isolation
        run: python3 test-reset-general-preferences.py -v
      - name: Verify preferences-wide Reset to Defaults confirmation and safe scope
        run: python3 test-reset-to-defaults.py -v
      - name: Verify main Dock icon and invisible PDF scan-helper policy
        run: python3 test-dock-behavior.py -v
      - name: Verify selected destination browser display never changes scanner policy
        run: python3 test-selected-destination-browser.py -v
      - name: Verify native window title and bundled application icon
        run: python3 test-native-window-branding.py -v
      - name: Verify independent SwiftUI application target
        run: python3 test-swiftui-app-target.py -v
      - name: Verify SwiftUI About window, version and AGPL license
        run: python3 test-about-window.py -v
      - name: Verify SwiftUI main preferences navigation and safe window wiring
        run: python3 test-main-preferences-window.py -v
      - name: Verify three accessible protection preview cards never change active scan policy
        run: python3 test-protection-settings-cards.py -v
      - name: Verify unavailable mandatory engines block effective profile selection
        run: python3 test-unavailable-protection-dependencies.py -v
      - name: Verify Reset Protection Settings is confirmed and scoped to preview metadata
        run: python3 test-reset-protection-settings.py -v
      - name: Verify selected protection previews are saved without scanner activation
        run: python3 test-protection-choice-persistence.py -v
      - name: Verify only measured protection timings appear in performance descriptions
        run: python3 test-protection-performance-implications.py -v
      - name: Verify opt-in ClamAV startup benchmark is isolated and unmeasured by default
        run: python3 test-scanner-startup-benchmark.py -v
      - name: Verify displayed checks for each protection level match the policy schema
        run: python3 test-protection-settings-checks.py -v
      - name: Audit increased system text size layout
        run: python3 test-preferences-large-text.py -v
      - name: Verify VoiceOver navigation labels
        run: python3 test-voiceover-preferences-navigation.py -v
      - name: Verify keyboard navigation through preferences
        run: python3 test-preferences-keyboard-navigation.py -v
      - name: Verify About and Diagnostics settings page
        run: python3 test-about-diagnostics-settings-page.py -v
      - name: Verify Advanced Scanning settings page and navigation
        run: python3 test-advanced-scanning-settings-page.py -v
      - name: Verify dedicated Updates settings page
        run: python3 test-updates-settings-page.py -v
      - name: Verify manual update action behavior
        run: python3 test-manual-update-actions.py -v
      - name: Verify signature update status is read-only and labeled in Updates
        run: python3 test-signature-update-status-display.py -v
      - name: Verify stale-signature warning and fail-closed age boundary
        run: python3 test-stale-signature-warning.py -v
      - name: Verify Notifications settings navigation and safe informational page
        run: python3 test-notifications-settings-page.py -v
      - name: Verify dedicated General settings page
        run: python3 test-general-settings-page.py -v
      - name: Verify persistent configuration storage location and user customizations
        run: python3 test-configuration-location.py -v
      - name: Verify upgrade preserves the installed PDF browser choice
        run: python3 test-persistent-installer-preferences.py -v
      - name: Verify versioned configuration contract without rewriting preferences
        run: python3 test-configuration-schema.py -v
      - name: Verify active scan count reports launched scans only
        run: python3 test-active-scan-count.py -v
      - name: Verify Show Scan Progress option and scanner safety
        run: python3 test-show-scan-progress.py -v
      - name: Verify Show Successful Scan Notifications option and fail-closed behavior
        run: |
          python3 test-show-successful-scan-notifications.py -v
          python3 test-show-blocked-file-notifications.py -v
      - name: Verify verified default PDF browser selector
        run: python3 test-default-pdf-browser-selector.py -v
      - name: Verify default PDF handler indicator is read-only
        run: python3 test-general-pdf-handler-indicator.py -v
      - name: Verify explicit General default PDF association action
        run: python3 test-general-default-pdf-action.py -v
      - name: Verify opt-in Restore Previous Default action
        run: python3 test-general-restore-previous-default.py -v
      - name: Verify Built-in scanner defaults appear before advanced explanations
        run: python3 test-scanner-defaults-summary.py -v
      - name: Verify dedicated Browsers settings page and safe navigation
        run: python3 test-browsers-settings-page.py -v
      - name: Verify explanatory help for technical preferences
        run: python3 test-technical-preferences-help.py -v
      - name: Verify Extensions and Integrations settings page
        run: python3 test-extensions-integrations-settings-page.py -v
      - name: Verify native Settings shortcut
        run: python3 test-settings-keyboard-shortcut.py -v
      - name: Verify menu-bar status item decision
        run: python3 test-menu-bar-decision.py -v
      - name: Verify Launch at Login is unnecessary for the standalone preferences app
        run: python3 test-launch-at-login-decision.py -v
      - name: Verify native application Quit action
        run: python3 test-native-quit-action.py -v
      - name: Verify opt-in PDF default-handler action
        run: python3 test-pdf-default-user-action.py -v
      - name: Verify application naming and migration
        run: python3 test-app-name.py
      - name: Verify generic PDF default-handler utility naming
        run: python3 test-pdf-default-handler-name.py -v
      - name: Verify opt-in PDF handler restoration offer
        run: python3 test-offer-restore-pdf-handler.py -v
      - name: Verify macOS PDF default-handler status reporting
        run: python3 test-pdf-handler-status.py -v
      - name: Verify active scan policy cannot change during execution
        run: python3 test-scan-policy-snapshot.py -v
      - name: Verify installed scanner configuration boundary values
        run: python3 test-scanner-configuration-boundaries.py -v
      - name: Verify macOS quarantine remains after clean, cached, and blocked scans
        run: python3 test-retain-os-quarantine.py -v
      - name: Verify Standard baseline parity with the existing scanner
        run: python3 test-standard-scanner-parity.py -v
      - name: Reject zero-length files before scanning, caching, or opening
        run: python3 test-zero-length-files.py -v
      - name: Reject unsupported ClamAV versions before scanning or cache reuse
        run: python3 test-clamav-version-support.py -v
      - name: Run scan-gate and request-metadata tests
        run: python3 test-scan-and-open.py -v
      - name: Detect installed ClamAV engine version without affecting scanner policy
        run: python3 test-installed-clamav-version.py -v
      - name: Inspect scanner-advertised capabilities without scanning documents
        run: python3 test-scanner-feature-check.py -v
      - name: Verify Standard signature database files exist before scanning
        run: python3 test-signature-database-existence.py -v
      - name: Verify cancellation and scanner process-group cleanup
        timeout-minutes: 2
        run: python3 test-cancellation.py -v
      - name: Verify detection and opening decisions are separate
        run: python3 test-detection-policy.py -v
      - name: Verify scanner errors are not presented as malware detections
        run: python3 test-scan-failure-presentation.py -v
      - name: Verify optional browser download identifiers
        run: python3 test-browser-download-id.py -v
      - name: Verify supported browser bundle identifier registry
        run: python3 test-browser-registry.py -v
      - name: Verify browser-independent scan engine and launch defaults
        run: python3 test-file-launcher.py
      - name: Verify PDF scan gates on external-drive paths
        run: python3 test-external-drives.py -v
      - name: Verify download-availability launch gate
        run: python3 test-download-availability.py -v
      - name: Inspect PDF annotations without evaluating their contents
        run: python3 test-pdf-annotations.py -v
      - name: Detect PDF rich-media content without media execution
        run: python3 test-pdf-rich-media.py -v
      - name: Verify locally accessible iCloud Drive PDFs
        run: python3 test-icloud-drive.py -v
      - name: Verify original PDF filenames, Unicode and special-character paths
        run: python3 test-pdf-filename-paths.py -v
      - name: Reject unsupported configuration values and fill absent keys safely
        run: python3 test-configuration-values.py -v
      - name: Validate optional scanner concurrency limits without changing scan safety
        run: python3 test-scanner-concurrency-limits.py -v
      - name: Validate persisted PDF application configuration and reject unsafe files
        run: python3 test-configuration-validation.py -v
      - name: Verify configurable PDF targets including Arc and Opera
        run: python3 test-target-app.py
      - name: Verify Microsoft Edge PDF launch routing and fail-closed behavior
        run: python3 test-edge-target.py -v
      - name: Verify Chromium PDF launching and fail-closed preflight
        run: python3 test-chromium-launch.py -v
      - name: Verify system-default-browser selection and fail-closed handoff
        run: python3 test-system-default-browser.py -v
      - name: Verify selector hides unsupported browsers and marks macOS default
        run: python3 test-browser-preference-selector.py -v
      - name: Verify selected-browser removal preserves preference and blocks PDF launch
        run: python3 test-selected-browser-removed.py -v
      - name: Verify explicit custom application choice and atomic persistence
        run: python3 test-select-custom-pdf-application.py -v
      - name: Verify Brave PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: brave
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Google Chrome PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: chrome
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Mozilla Firefox PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: firefox
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Safari PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: safari
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Microsoft Edge PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: edge
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Chromium PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: chromium
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Vivaldi PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: vivaldi
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Opera PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: opera
        run: python3 test-browser-pdf-behavior.py
      - name: Verify Arc PDF opening separately
        env:
          PDF_MAGIC_TEST_BROWSER: arc
        run: python3 test-browser-pdf-behavior.py
      - name: Verify stable and preview browser release classification
        run: python3 test-browser-release.py -v
      - name: Verify browser PDF viewer comparison documentation
        run: python3 test-browser-viewer-docs.py -v
      - name: Verify optional PDF fallback selection and safety
        run: python3 test-fallback-app.py -v
      - name: Verify clean scan results survive launch failures
        run: python3 test-launch-results.py -v
      - name: Verify scan-request origin records
        run: python3 test-scan-request-origin.py
      - name: Verify scan-request application attribution
        run: python3 test-scan-request.py
      - name: Verify file lifecycle state transitions
        run: python3 test-file-lifecycle.py
      - name: Measure extra Enhanced analysis time without changing scan outcomes
        run: python3 test-enhanced-analysis-timing.py -v
      - name: Verify cross-process scan concurrency
        run: python3 test-scan-concurrency.py
      - name: Verify native owner termination aborts active scans
        run: python3 test-app-termination.py -v

      - name: Verify scan result contract
        run: python3 test-scan-results.py
      - name: Verify stable structured Enhanced finding identifiers and incomplete-stage safety
        run: python3 test-enhanced-analysis-findings.py -v
      - name: Explain each Enhanced analysis finding with safe handling guidance
        run: python3 test-enhanced-finding-explanations.py -v
      - name: Determine which Enhanced findings require additional inspection
        run: python3 test-enhanced-additional-inspections.py -v
      - name: Verify effective protection policy identifier in scan results
        run: python3 test-effective-policy-scan-results.py -v
      - name: Verify responses for every detection remain fail-closed
        run: python3 test-detection-responses.py -v
      - name: Inspect suspicious embedded PDF URLs without fetching destinations
        run: python3 test-pdf-suspicious-urls.py -v

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Built-in scanner defaults on macOS
        run: python3 test-scanner-defaults-summary.py -v
      - name: Verify staged ClamAV signature databases before activation on macOS
        run: python3 test-validate-signature-database.py -v
      - name: Test signature directory permissions on macOS
        run: python3 test-signature-directory-permissions.py -v
      - name: Test read-only ClamAV signature revision parsing
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors PDFMagicOpenerApp/SignatureUpdateStatus.swift PDFMagicOpenerApp/SignatureUpdateProgress.swift PDFMagicOpenerApp/UpdatesSettingsView.swift test-manual-update-actions.swift -o "$RUNNER_TEMP/TestManualUpdateActions"
          "$RUNNER_TEMP/TestManualUpdateActions"
      - name: Verify safe native signature timestamp status reading
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors PDFMagicOpenerApp/SignatureUpdateStatus.swift test-signature-update-status.swift -o "$RUNNER_TEMP/TestSignatureUpdateStatus"
          "$RUNNER_TEMP/TestSignatureUpdateStatus"
      - name: Verify native stale-signature warning at the scanner age boundary
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors PDFMagicOpenerApp/SignatureUpdateStatus.swift test-stale-signature-warning.swift -o "$RUNNER_TEMP/TestStaleSignatureWarning"
          "$RUNNER_TEMP/TestStaleSignatureWarning"
      - name: Verify native signature-update failure metadata safely
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors PDFMagicOpenerApp/SignatureUpdateStatus.swift test-signature-update-failures.swift -o "$RUNNER_TEMP/TestSignatureUpdateFailures"
          "$RUNNER_TEMP/TestSignatureUpdateFailures"
      - name: Verify on-open, live and manual browser refresh actions
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors -D BROWSER_DISCOVERY_TESTING -D BROWSER_METADATA_TESTING browser-preference-list.swift browser-preference-live-refresh.swift discover-installed-browsers.swift browser-app-metadata.swift -o "$RUNNER_TEMP/BrowserPreferenceList"
          xcrun swiftc -parse-as-library -warnings-as-errors -D BROWSER_DISCOVERY_TESTING -D BROWSER_METADATA_TESTING -D BROWSER_PREFERENCE_TESTING browser-preference-list.swift discover-installed-browsers.swift browser-app-metadata.swift test-browser-preference-list.swift -o "$RUNNER_TEMP/TestBrowserPreferenceList"
          "$RUNNER_TEMP/TestBrowserPreferenceList"
          xcrun swiftc -parse-as-library -warnings-as-errors -D BROWSER_DISCOVERY_TESTING -D BROWSER_METADATA_TESTING -D BROWSER_PREFERENCE_TESTING browser-preference-list.swift browser-preference-live-refresh.swift discover-installed-browsers.swift browser-app-metadata.swift test-browser-preference-live-refresh.swift -o "$RUNNER_TEMP/TestBrowserPreferenceLiveRefresh"
          "$RUNNER_TEMP/TestBrowserPreferenceLiveRefresh"
          if "$RUNNER_TEMP/BrowserPreferenceList" --metadata-stdin </dev/null; then exit 1; fi
          if "$RUNNER_TEMP/BrowserPreferenceList" --invalid-option; then exit 1; fi
      - name: Verify atomic and cross-process configuration persistence and failure safety
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors PDFMagicOpenerApp/AtomicConfigurationWriter.swift test-atomic-configuration-writer.swift -o "$RUNNER_TEMP/TestAtomicConfigurationWriter"
          "$RUNNER_TEMP/TestAtomicConfigurationWriter"
      - name: Verify native signature-update progress metadata safely
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors PDFMagicOpenerApp/SignatureUpdateProgress.swift test-signature-update-progress.swift -o "$RUNNER_TEMP/TestSignatureUpdateProgress"
          "$RUNNER_TEMP/TestSignatureUpdateProgress"
      - name: Build SwiftUI application target without registering PDF handling
        run: |
          plutil -lint PDFMagicOpener.xcodeproj/project.pbxproj
          xcodebuild -project PDFMagicOpener.xcodeproj -scheme PDFMagicOpener -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/PDFMagicOpenerDerived" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/PDFMagicOpenerDerived/Build/Products/Debug/PDFMagicOpener.app"
          test -x "$app/Contents/MacOS/PDFMagicOpener"
          python3 -c 'import plistlib,sys; p=plistlib.load(open(sys.argv[1], "rb")); assert p["CFBundlePackageType"] == "APPL"; assert p["CFBundleIdentifier"] == "local.studio.pdfmagicopener.swiftui"; assert "CFBundleDocumentTypes" not in p; assert p.get("LSUIElement", False) is False, "Preferences must appear in Dock"; assert p.get("LSBackgroundOnly", False) is False, "Preferences must not be headless"' "$app/Contents/Info.plist"
      - name: Exercise SwiftUI preferences at increased text sizes
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors \
            PDFMagicOpenerApp/*SettingsView.swift PDFMagicOpenerApp/MainPreferencesView.swift \
            PDFMagicOpenerApp/DefaultPDFBrowserPreferences.swift \
            PDFMagicOpenerApp/ScanProgressPreference.swift \
            PDFMagicOpenerApp/SignatureUpdateStatus.swift \
            PDFMagicOpenerApp/SignatureUpdateProgress.swift \
            test-preferences-large-text.swift -o "$RUNNER_TEMP/TestPreferencesLargeText"
          "$RUNNER_TEMP/TestPreferencesLargeText"
      - name: Test General PDF handler status against Launch Services
        run: |
          xcrun swiftc -parse-as-library -warnings-as-errors \
            PDFMagicOpenerApp/GeneralSettingsView.swift PDFMagicOpenerApp/DefaultPDFBrowserPreferences.swift \
            PDFMagicOpenerApp/PDFDefaultApplicationSettingsView.swift \
            PDFMagicOpenerApp/ScanProgressPreference.swift \
            test-general-pdf-handler-indicator.swift -o "$RUNNER_TEMP/TestGeneralPDFHandlerIndicator"
          "$RUNNER_TEMP/TestGeneralPDFHandlerIndicator"
      - name: Verify built app icon and macOS window branding
        run: |
          app="$RUNNER_TEMP/PDFMagicOpenerDerived/Build/Products/Debug/PDFMagicOpener.app"
          python3 - "$app/Contents/Info.plist" <<'ICON_PLIST'
          import plistlib
          import sys
          with open(sys.argv[1], "rb") as stream:
              info = plistlib.load(stream)
          assert info["CFBundleDisplayName"] == "PDF Magic Opener", info
          assert info["CFBundleIconFile"] in ("PDFMagicOpenerIcon", "PDFMagicOpenerIcon.icns"), info
          ICON_PLIST
