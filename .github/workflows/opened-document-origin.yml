name: Opened PDF origin audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  opened-document-origin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify successful original versus generated handoff audit
        run: python3 test-opened-document-origin.py -v
