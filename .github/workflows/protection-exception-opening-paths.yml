name: Protection exception opening-path safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-exception-opening-bypass:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exception claims never bypass scan and opening gates
        run: python3 test-protection-exception-opening-paths.py -v
