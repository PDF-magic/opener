name: Enhanced finding PDF object references

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  finding-object-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify generation-aware PDF object references on findings
        run: python3 test-enhanced-finding-object-references.py -v
      - name: Preserve structured finding contract
        run: python3 test-enhanced-analysis-findings.py -v
      - name: Preserve references through finding explanations
        run: python3 test-enhanced-finding-explanations.py -v
