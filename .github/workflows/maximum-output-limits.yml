name: Maximum Worker Output Limits

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  output-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify output-size limits and duplex streaming
        run: python3 test-maximum-output-limits.py -v
  output-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify macOS output-size limits and duplex streaming
        run: python3 test-maximum-output-limits.py -v
