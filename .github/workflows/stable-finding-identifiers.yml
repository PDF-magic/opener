name: Stable Enhanced finding identifiers

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  stable-finding-identifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify deterministic structured finding identifiers
        run: python3 test-enhanced-analysis-findings.py -v
      - name: Verify heuristic findings are not presented as confirmed malware
        run: python3 test-enhanced-finding-explanations.py -v
      - name: Keep scanner detections distinct from heuristic findings
        run: python3 test-detection-responses.py -v
