name: ClamAV compatibility watch

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clamav-compatibility-watch:
    name: Review ClamAV engine release compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release parsing and scanner safety contracts offline
        run: PYTHONPATH=. python3 tests/clamav/compatibility-watch.py -v
      - name: Detect upstream changes to supported ClamAV releases
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/clamav_compatibility_watch.py
