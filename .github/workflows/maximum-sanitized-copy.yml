name: Maximum sanitized PDF copy CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sanitized-copy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install strict PDF validation dependency
        run: python3 -m pip install --disable-pip-version-check 'pypdf==5.9.0' 'Pillow==11.3.0'
      - name: Verify hard sanitizer execution deadline and process-tree cleanup
        run: python3 test-maximum-sanitizer-time-limits.py -v
      - name: Verify sanitizer memory ceiling and fail-closed behavior
        run: python3 test-maximum-sanitizer-memory-limits.py -v
      - name: Verify page geometry, supported-only copy offers and scanner isolation
        run: |
          python3 test-maximum-active-content-removal.py -v
          python3 test-maximum-sanitized-copy.py -v
          python3 test-maximum-sanitizer-reporting.py -v
      - name: Verify text-readability metrics and source PDF fixtures
        run: python3 test-maximum-text-readability.py -v
      - name: Verify image-detail metrics and embedded-picture fixtures
        run: python3 test-maximum-image-readability.py -v
      - name: Verify multi-column fixture geometry and layout metrics
        run: python3 test-maximum-multi-column-fidelity.py -v
      - name: Check rotated-page fixtures and orientation negative controls
        run: python3 test-maximum-rotated-pages.py -v
      - name: Verify scanned-document fixtures and degradation metrics
        run: python3 test-maximum-scanned-documents.py -v
      - name: Verify vector graphics fixture and shape metrics
        run: python3 test-maximum-vector-graphics.py -v
      - name: Verify transparency fixtures and alpha-compositing metrics
        run: python3 test-maximum-transparency.py -v
      - name: Validate annotation fixtures and negative fidelity controls
        run: python3 test-maximum-annotations.py -v
      - name: Validate real interactive form fixtures and visual negative controls
        run: python3 test-maximum-interactive-forms.py -v
      - name: Verify password-protected documents never produce conversion offers
        run: python3 test-maximum-password-protected.py -v
      - name: Reject unsupported sanitization and unsafe fallback on Linux
        run: python3 test-maximum-sanitization-blocking.py -v

  sanitized-copy-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install strict PDF validation dependency
        run: python3 -m pip install --disable-pip-version-check 'pypdf==5.9.0' 'Pillow==11.3.0'
      - name: Compile optional CoreGraphics raster conversion worker
        run: swiftc -O maximum_sanitized_copy.swift -o maximum-sanitized-copy
      - name: Verify hard sanitizer execution deadline and process-tree cleanup
        run: python3 test-maximum-sanitizer-time-limits.py -v
      - name: Verify sanitizer memory ceiling and fail-closed behavior
        run: python3 test-maximum-sanitizer-memory-limits.py -v
      - name: Verify real conversion preserves page order, dimensions, rotation and discards PDF actions
        run: |
          python3 test-maximum-active-content-removal.py -v
          python3 test-maximum-sanitized-copy.py -v
          python3 test-maximum-sanitizer-reporting.py -v
      - name: Verify actual converted PDF text remains visually legible
        run: python3 test-maximum-text-readability.py -v
      - name: Verify pictures stay visually readable after actual conversion
        run: python3 test-maximum-image-readability.py -v
      - name: Verify actual two- and three-column PDF conversion fidelity
        run: python3 test-maximum-multi-column-fidelity.py -v
      - name: Verify real rotated-page visual fidelity after conversion
        run: python3 test-maximum-rotated-pages.py -v
      - name: Verify actual scanned pages remain legible after conversion
        run: python3 test-maximum-scanned-documents.py -v
      - name: Verify actual vector graphics fidelity after CoreGraphics conversion
        run: python3 test-maximum-vector-graphics.py -v
      - name: Verify actual transparency and blend fidelity after conversion
        run: python3 test-maximum-transparency.py -v
      - name: Verify actual annotated PDF visual fidelity and removal
        run: python3 test-maximum-annotations.py -v
      - name: Verify actual interactive AcroForm raster fidelity and removal
        run: python3 test-maximum-interactive-forms.py -v
      - name: Verify protected PDF behavior with the real CoreGraphics worker
        run: python3 test-maximum-password-protected.py -v
      - name: Reject unsupported sanitization and unsafe fallback on macOS
        run: python3 test-maximum-sanitization-blocking.py -v
