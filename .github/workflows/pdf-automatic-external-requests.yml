name: Automatic PDF external request inspection

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  automatic-external-request-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Enhanced PDF parser
        run: python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt
      - name: Detect network-targeting actions reached from automatic triggers
        run: python3 test-pdf-automatic-external-requests.py -v
      - name: Preserve automatic-action traversal regressions
        run: python3 test-pdf-automatic-actions.py -v
      - name: Preserve inert external URL classification regressions
        run: python3 test-pdf-suspicious-urls.py -v
      - name: Preserve form action inspection regressions
        run: python3 test-pdf-form-actions.py -v
