name: Paired PDF performance regression thresholds

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  performance-regression-thresholds:
    name: Check same-runner medium-PDF regression thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact target baseline in isolation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: baseline
          persist-credentials: false
      - name: Check out exact proposed head in isolation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the comparison policy and fail-closed inputs
        run: cd candidate && PYTHONPATH=. python3 tests/performance/regression-thresholds.py -v
      - name: Reject incomparable fixture, measurement, or dependency revisions
        shell: bash
        run: |
          set -euo pipefail
          cmp -s baseline/medium_pdf_benchmark.py candidate/medium_pdf_benchmark.py
          cmp -s baseline/pdf_parser_memory_benchmark.py candidate/pdf_parser_memory_benchmark.py
          cmp -s baseline/requirements-enhanced-pdf.txt candidate/requirements-enhanced-pdf.txt
      - name: Install pinned parser requirements once for both checkouts
        run: python3 -m pip install --disable-pip-version-check -r candidate/requirements-enhanced-pdf.txt
      - name: Run alternating, independent 5-sample comparisons and enforce limits
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && PYTHONPATH=. python3 medium_pdf_benchmark.py --runs 5) > baseline-1.json
          (cd candidate && PYTHONPATH=. python3 medium_pdf_benchmark.py --runs 5) > candidate-1.json
          (cd candidate && PYTHONPATH=. python3 medium_pdf_benchmark.py --runs 5) > candidate-2.json
          (cd baseline && PYTHONPATH=. python3 medium_pdf_benchmark.py --runs 5) > baseline-2.json
          python3 candidate/performance_regression_thresholds.py \
            --baseline baseline-1.json baseline-2.json \
            --candidate candidate-1.json candidate-2.json
