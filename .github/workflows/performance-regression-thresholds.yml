name: Paired PDF performance regression thresholds

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  performance-regression-thresholds:
    name: Check same-runner medium-PDF regression thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact target baseline in isolation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: baseline
          persist-credentials: false
      - name: Check out exact proposed head in isolation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the comparison policy and fail-closed inputs
        run: |
          cd candidate
          PYTHONPATH=. python3 tests/performance/regression-thresholds.py -v
          PYTHONPATH=. python3 tests/performance/benchmark-layout.py -v
      - name: Reject incomparable fixture or measurement revisions
        shell: bash
        run: |
          set -euo pipefail
          baseline_benchmark="$(python3 candidate/scripts/compare-benchmark-layout.py baseline candidate)"
          printf 'BASELINE_BENCHMARK=%s\n' "$baseline_benchmark" >> "$GITHUB_ENV"
          # The next step installs candidate requirements into the SAME runner
          # for both isolated revisions. Equal environments make app-code timing
          # comparable even when the security-reviewed parser pin changes.
      - name: Install pinned parser requirements once for both checkouts
        working-directory: candidate
        run: python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt
      - name: Run alternating, independent 5-sample comparisons and enforce limits
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && PYTHONPATH=. python3 "$BASELINE_BENCHMARK" --runs 5) > baseline-1.json
          (cd candidate && PYTHONPATH=. python3 benchmarks/medium-pdf-benchmark.py --runs 5) > candidate-1.json
          (cd candidate && PYTHONPATH=. python3 benchmarks/medium-pdf-benchmark.py --runs 5) > candidate-2.json
          (cd baseline && PYTHONPATH=. python3 "$BASELINE_BENCHMARK" --runs 5) > baseline-2.json
          python3 candidate/benchmarks/performance-regression-thresholds.py \
            --baseline baseline-1.json baseline-2.json \
            --candidate candidate-1.json candidate-2.json
