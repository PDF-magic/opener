name: Maximum filesystem confinement

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  maximum-filesystem-sandbox:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the kernel sandbox denies user file reads and writes
        run: python3 test-maximum-filesystem-sandbox.py -v
