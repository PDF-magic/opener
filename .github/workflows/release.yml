name: Guarded GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag at the exact current main commit"
        required: true
        type: string

# Source archives and SHA256SUMS are the only assets; no signing, store publication,
# unsigned installable builds, or tag creation is performed.
# GitHub Releases created outside this workflow require repository-admin
# governance; repository YAML cannot prohibit direct UI/API publication.
permissions:
  contents: read
  checks: read

concurrency:
  group: guarded-github-release
  cancel-in-progress: false

jobs:
  critical-release-gate:
    name: Verify critical checks and distribution readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject missing, failed, skipped or unfinished critical checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/require_release_checks.py --tag "$RELEASE_TAG"
      - name: Run the release gate regression suite
        run: PYTHONPATH=. python3 tests/general/release-check-gate.py -v

  publish-source-release:
    name: Publish verified source-only GitHub release
    needs: critical-release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build only tagged, immutable source archives
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          stage="$RUNNER_TEMP/pdf-magic-source-release"
          base="pdf-magic-opener-$RELEASE_TAG"
          mkdir -m 700 "$stage"
          git archive --format=tar --prefix="$base/" "$GITHUB_SHA" | gzip -n > "$stage/$base-source.tar.gz"
          git archive --format=zip --prefix="$base/" "$GITHUB_SHA" > "$stage/$base-source.zip"
          python3 scripts/create_release_checksums.py --directory "$stage" --tag "$RELEASE_TAG"
          python3 scripts/create_release_checksums.py --directory "$stage" --tag "$RELEASE_TAG" --verify
      - name: Reverify exact main and tag before drafting the source-only release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/require_release_checks.py --tag "$RELEASE_TAG"
      - name: Create draft, upload verified sources and checksums, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/pdf-magic-source-release"
          python3 scripts/create_release_checksums.py --directory "$stage" --tag "$RELEASE_TAG" --verify
          gh release create "$RELEASE_TAG" --verify-tag --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --draft
          gh release upload "$RELEASE_TAG" "$stage"/*
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/source-release-metadata.json"
          python3 scripts/create_release_checksums.py --directory "$stage" --tag "$RELEASE_TAG" --verify --release-json "$RUNNER_TEMP/source-release-metadata.json"
          gh release edit "$RELEASE_TAG" --draft=false
