name: Maximum Isolated PDF Rendering

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  isolated-renderer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PDF raster renderer
        run: python3 -m pip install --disable-pip-version-check 'pymupdf==1.26.7'
      - name: Verify real isolated page rasterization and fail-closed limits
        run: python3 test-maximum-isolated-renderer.py -v