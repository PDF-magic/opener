name: Prepare root application layout

on:
  push:
    branches: [shoeshine]
    paths:
      - scripts/prepare-root-layout.py
      - .github/workflows/prepare-root-layout.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt 'Pillow==11.3.0' 'cryptography==46.0.4'
      - run: python3 scripts/prepare-root-layout.py
