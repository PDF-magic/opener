name: Validate root Python relocation

on:
  push:
    branches: [shoeshine]
    paths:
      - src/**
      - scripts/installation/**
      - .github/workflows/prepare-root-layout.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install --disable-pip-version-check -r requirements-enhanced-pdf.txt 'Pillow==11.3.0' 'cryptography==46.0.4'
      - name: Check Python syntax and affected CI test paths
        run: |
          python3 -m compileall -q src scripts/installation
          python3 - <<'PY'
          import re
          from pathlib import Path
          for workflow in Path(".github/workflows").glob("*.yml"):
              for match in re.finditer(r"\bpython3\s+(tests/[\w/-]+\.py)\b", workflow.read_text()):
                  assert Path(match.group(1)).is_file(), (workflow, match.group(1))
          PY
      - name: Run affected root application tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python3 tests/browser/preference-selector.py -v
          python3 tests/browser/release.py -v
          python3 tests/clamav/install-consent.py -v
          python3 tests/configuration/loading.py -v
          python3 tests/configuration/values.py -v
          python3 tests/enhanced/javascript-action-profile.py -v
          python3 tests/enhanced/legitimate-forms.py -v
          python3 tests/enhanced/new-install-default.py -v
          python3 tests/enhanced/password-protected.py -v
          python3 tests/enhanced/profile-embedded-attachments.py -v
          python3 tests/file/lifecycle.py -v
          python3 tests/general/combined-scan-results.py -v
          python3 tests/general/detection-responses.py -v
          python3 tests/general/document-security-report.py -v
          python3 tests/general/effective-policy-display.py -v
          python3 tests/general/effective-policy-scan-results.py -v
          python3 tests/general/effective-protection-policy.py -v
          python3 tests/general/installation-prerequisites.py -v
          python3 tests/general/missing-dependency-policy.py -v
          python3 tests/general/offer-restore-pdf-handler.py -v
          python3 tests/general/reference-pdf-profiles.py -v
          python3 tests/general/selected-browser-removed.py -v
          python3 tests/general/signature-update-documentation.py -v
          python3 tests/general/standard-scanner-parity.py -v
          python3 tests/general/stop-owned-processes.py -v
          python3 tests/general/timed-pdf-structure-analysis.py -v
          python3 tests/general/unavailable-protection-dependencies.py -v
          python3 tests/general/uninstall-history-choice.py -v
