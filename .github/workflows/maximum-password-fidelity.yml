name: Maximum password-protected document fidelity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  password-fidelity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PDF test dependencies
        run: python3 -m pip install --disable-pip-version-check 'pypdf==5.9.0' 'Pillow==11.3.0'
      - name: Verify encrypted PDFs block Maximum conversion and never prompt
        run: python3 test-maximum-password-protected.py -v

  password-fidelity-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PDF test dependencies
        run: python3 -m pip install --disable-pip-version-check 'pypdf==5.9.0' 'Pillow==11.3.0'
      - name: Compile genuine CoreGraphics converter
        run: swiftc -O maximum_sanitized_copy.swift -o maximum-sanitized-copy
      - name: Verify real converter refuses password-protected PDFs
        run: python3 test-maximum-password-protected.py -v
