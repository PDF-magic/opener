name: Browser-native PDF downloads

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-native-pdf-download:
    name: Chrome browser-native PDF downloads
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Verify Chrome handles downloaded PDF attachments
        working-directory: extensions/webextension
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # Only the disposable CI Chrome profile may use this exception.
          CHROME_TEST_NO_SANDBOX: "1"
          PDF_MAGIC_CHROME_HANDOFF_DIR: ${{ runner.temp }}/chrome-native-downloads
        run: |
          mkdir -p "$PDF_MAGIC_CHROME_HANDOFF_DIR"
          node scripts/test-chrome-native-pdf-download.mjs "$CHROME_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-downloaded-pdfs
          path: ${{ runner.temp }}/chrome-native-downloads/*.pdf
          if-no-files-found: error
          retention-days: 1

  chromium-native-pdf-download:
    name: Chromium browser-native PDF downloads
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@v2
        id: chromium
        with:
          # Official unbranded Chromium, not the branded stable Chrome build.
          chrome-version: latest
      - name: Verify real Chromium downloads PDF attachments
        working-directory: extensions/webextension
        env:
          CHROMIUM_BINARY_PATH: ${{ steps.chromium.outputs.chrome-path }}
          # Only the disposable CI Chromium profile may use this exception.
          CHROMIUM_TEST_NO_SANDBOX: "1"
        run: node scripts/test-chromium-native-pdf-download.mjs "$CHROMIUM_BINARY_PATH"

  firefox-native-pdf-download:
    name: Firefox browser-native PDF downloads
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: latest
      - uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ github.token }}
      - name: Verify Firefox handles downloaded PDF attachments
        working-directory: extensions/webextension
        env:
          FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: node scripts/test-firefox-native-pdf-download.mjs "$FIREFOX_PATH"

  chrome-macos-quarantine-open:
    name: Chrome macOS downloaded PDF safe-open and quarantine
    needs: chrome-native-pdf-download
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      # These bytes were downloaded by real Chrome in the Linux job, not
      # synthesized on macOS. Artifact transport does not preserve xattrs.
      - uses: actions/download-artifact@v4
        with:
          name: chrome-downloaded-pdfs
          path: ${{ runner.temp }}/chrome-native-downloads
      - name: Verify opening Chrome-downloaded PDFs retains macOS quarantine
        env:
          PDF_MAGIC_CHROME_DOWNLOAD_DIR: ${{ runner.temp }}/chrome-native-downloads
        run: PYTHONPATH=. python3 tests/general/chrome-downloaded-quarantine.py -v
