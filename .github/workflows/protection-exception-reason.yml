name: Unsupported protection exception reasons

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  exception-reason-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify fixed rejection-reason record and mandatory scan
        run: |
          python3 test-protection-exception-reason.py -v
          python3 test-protection-exceptions-decision.py -v
