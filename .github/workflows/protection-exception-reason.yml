name: Unsupported protection exception reasons

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  exception-reason-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify fixed rejection-reason record and mandatory scan
        run: |
          python3 test-protection-exception-reason.py -v
          # The existing exception-decision test uses a Linux-specific
          # temporary path assertion; keep its established Linux CI coverage.
          if [ "$RUNNER_OS" = "Linux" ]; then
            python3 test-protection-exceptions-decision.py -v
          fi
