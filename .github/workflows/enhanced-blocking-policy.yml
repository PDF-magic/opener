name: Enhanced Finding Blocking Policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  blocking-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test exhaustive Enhanced finding blocking rules
        run: python3 test-enhanced-blocking-policy.py -v
      - name: Verify existing fail-closed Enhanced analysis policies
        run: |
          python3 test-enhanced-analysis-findings.py -v
          python3 test-enhanced-inconclusive-results.py -v
          python3 test-enhanced-additional-inspections.py -v
      - name: Verify blocking severity in explainable finding results
        run: python3 test-enhanced-finding-explanations.py -v
