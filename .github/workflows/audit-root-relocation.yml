name: Audit root source relocation

on:
  push:
    branches: [shoeshine]
    paths:
      - .github/workflows/audit-root-relocation.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare and inspect candidate source tree
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import re
          import subprocess
          moves = {
              "detect-pdf-handler-change.swift": "src/native/handler/detect-pdf-handler-change.swift",
              "identify-pdf-handler.swift": "src/native/handler/identify-pdf-handler.swift",
              "make-pdf-magic-default.swift": "src/native/handler/make-pdf-magic-default.swift",
              "pdf-handler-history.swift": "src/native/handler/pdf-handler-history.swift",
              "set-pdf-default-handler.swift": "src/native/handler/set-pdf-default-handler.swift",
              "launch-scanned-file.swift": "src/native/launch/launch-scanned-file.swift",
              "select-custom-pdf-application.swift": "src/native/launch/select-custom-pdf-application.swift",
              "verify-pdf-target.swift": "src/native/launch/verify-pdf-target.swift",
              "brave-pdf-opener.swift": "src/native/launch/brave-pdf-opener.swift",
              "scan-progress-view.swift": "src/scan/scan-progress-view.swift",
          }
          artwork = "src/scan/twilight-reading.png"
          files = [pathlib.Path(p.decode()) for p in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0") if p]
          for path in files:
              if path.as_posix() == ".github/workflows/audit-root-relocation.yml":
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  source = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = source
              for name, destination in moves.items():
                  def replace(match):
                      prefix = match.string[max(0, match.start() - 120):match.start()]
                      if re.search(r"(?:tests/[A-Za-z0-9_/-]+|src/[A-Za-z0-9_/-]+)/$", prefix) or prefix.endswith("/source/"):
                          return match.group()
                      return destination
                  updated = re.sub(r"(?<![A-Za-z0-9_.-])" + re.escape(name), replace, updated)
              if path.as_posix() == "install-allow-and-open.sh":
                  updated = updated.replace("$script_dir/twilight-reading.png", "$script_dir/" + artwork)
              elif path.as_posix() == ".github/workflows/ci.yml":
                  updated = updated.replace("cp twilight-reading.png ", "cp " + artwork + " ")
              elif path.as_posix() == "README.md":
                  updated = updated.replace("`twilight-reading.png`", "`" + artwork + "`")
              elif path.parts[0] == "tests":
                  updated = updated.replace('parents[2] / "twilight-reading.png"', 'parents[2] / "' + artwork + '"')
              if updated != source:
                  path.write_bytes(updated.encode("utf-8"))
                  encoded = base64.b64encode(updated.encode("utf-8")).decode("ascii")
                  print("CANDIDATE_BEGIN " + path.as_posix())
                  for start in range(0, len(encoded), 6000):
                      print("CANDIDATE_DATA " + encoded[start:start+6000])
                  print("CANDIDATE_END")
              if path.as_posix() in moves and "#filePath" in source:
                  print("SOURCE_PATH_DEPENDENCY " + path.as_posix())
          for source, destination in {**moves, "twilight-reading.png": artwork}.items():
              src, dest = pathlib.Path(source), pathlib.Path(destination)
              assert src.is_file() and not dest.exists()
              dest.parent.mkdir(parents=True, exist_ok=True)
              src.rename(dest)
              print("MOVE " + source + " " + destination)
          print("CANDIDATE_COMPLETE")
          PY
          git diff --check
          bash -n install-allow-and-open.sh
          python3 -m compileall -q src tests
      - name: Check relocated source references
        env:
          PYTHONPATH: .
        run: |
          python3 tests/general/macos-file-handler-api-watch.py -v
          python3 tests/pdf/default-handler-name.py -v
          python3 tests/pdf/default-user-action.py -v
          python3 tests/general/offer-restore-pdf-handler.py -v
          python3 tests/browser/viewer-docs.py -v
          python3 tests/browser/registry.py -v
          python3 tests/scan/result-summary-component.py -v
